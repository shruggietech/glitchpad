name: android-package

on:
  pull_request:
    paths:
      - '.github/workflows/android-package.yml'
      - 'apps/glitchpad/**'
      - 'crates/glitchpad-android-source/**'
      - 'crates/glitchpad-core/**'
      - 'crates/glitchpad-host/**'
      - 'packaging/android/**'
      - 'packaging/desktop/capabilities.json'
      - 'scripts/android/**'
      - 'scripts/check-android-package*.mjs'
      - 'scripts/generate-android-sbom.mjs'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-package.yml'
      - 'apps/glitchpad/**'
      - 'crates/glitchpad-android-source/**'
      - 'crates/glitchpad-core/**'
      - 'crates/glitchpad-host/**'
      - 'packaging/android/**'
      - 'packaging/desktop/capabilities.json'
      - 'scripts/android/**'
      - 'scripts/check-android-package*.mjs'
      - 'scripts/generate-android-sbom.mjs'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      stage_release:
        description: Prepare stable-key unpublished release inputs (no publication)
        type: boolean
        default: false
      runtime_scope:
        description: Full candidate qualification or startup/PDF diagnostic only
        type: choice
        options: [full, startup, pdf]
        default: full

env:
  GLITCHPAD_BUILD_COMMIT: ${{ github.sha }}
  VITE_GLITCHPAD_BUILD_COMMIT: ${{ github.sha }}

permissions:
  contents: read

concurrency:
  group: android-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Signed Android candidate artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate preparation authority
        env:
          STAGE_RELEASE: ${{ inputs.stage_release || false }}
        run: |
          test "$GITHUB_REF_TYPE" = branch
          if [ "$STAGE_RELEASE" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REPOSITORY" = shruggietech/glitchpad
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install pinned Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;28.2.13676358"

      - name: Install pinned bundletool
        env:
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --strict

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-package-aarch64-x86_64

      - name: Create disposable candidate signing authority
        if: ${{ !inputs.stage_release }}
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/glitchpad-candidate.jks" -storepass candidate-password -keypass candidate-password -alias candidate -keyalg RSA -keysize 3072 -validity 2 -dname "CN=Glitchpad Pull Request Candidate, O=ShruggieTech, C=US"
          {
            echo "storeFile=$RUNNER_TEMP/glitchpad-candidate.jks"
            echo 'password=candidate-password'
            echo 'keyPassword=candidate-password'
            echo 'keyAlias=candidate'
          } > crates/glitchpad-host/gen/android/keystore.properties

      - name: Restore stable project signing authority
        if: github.event_name == 'workflow_dispatch' && inputs.stage_release && github.repository == 'shruggietech/glitchpad'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_SIGNING_CERT_SHA256"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/glitchpad-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/glitchpad-release.jks"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
          } > crates/glitchpad-host/gen/android/keystore.properties

      - name: Run Android package contract tests
        run: pnpm run check:android-package

      - name: Prove isolated release test runtime ABI
        run: ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android/buildSrc test --no-daemon --console=plain

      - name: Build universal APK and AAB
        run: |
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          pnpm tauri android build --apk --aab --target aarch64 --target x86_64 --ci --config tauri.s022-android.conf.json
          cp crates/glitchpad-host/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$RUNNER_TEMP/app-universal-release.apk"
          cp crates/glitchpad-host/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab "$RUNNER_TEMP/app-universal-release.aab"

      - name: Stage exact PDF journey test asset
        run: node --input-type=module -e "import { copyFile } from 'node:fs/promises'; await copyFile('scripts/pdf-reading-journey.js', 'fixtures/pdf/pdf-reading-journey.js');"

      - name: Build matching release instrumentation without changing canonical inputs
        run: |
          ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :app:assembleUniversalReleaseAndroidTest -Pglitchpad.testBuildType=release -PabiList=arm64-v8a,x86_64 -ParchList=arm64,x86_64 -PtargetList=aarch64,x86_64 -x :app:rustBuildUniversalRelease -x :app:rustBuildArm64Release -x :app:rustBuildX86_64Release --no-daemon
          cmp "$RUNNER_TEMP/app-universal-release.apk" crates/glitchpad-host/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          mkdir -p artifacts/android-release-inputs
          cp crates/glitchpad-host/gen/android/app/build/outputs/apk/androidTest/universal/release/app-universal-release-androidTest.apk artifacts/android-release-inputs/instrumentation.apk
          cp crates/glitchpad-host/gen/android/app/build/outputs/mapping/universalRelease/mapping.txt artifacts/android-release-inputs/r8-mapping.txt
          test -s artifacts/android-release-inputs/r8-mapping.txt
          python3 scripts/android/check-release-test-notices.py --apk artifacts/android-release-inputs/instrumentation.apk
          ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :app:dependencies --configuration universalReleaseAndroidTestCompileClasspath -Pglitchpad.testBuildType=release --no-daemon > artifacts/android-release-inputs/test-compile-dependencies.txt
          ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :app:dependencies --configuration universalReleaseAndroidTestRuntimeClasspath -Pglitchpad.testBuildType=release --no-daemon > artifacts/android-release-inputs/test-runtime-dependencies.txt
          apkanalyzer dex packages --defined-only artifacts/android-release-inputs/instrumentation.apk > artifacts/android-release-inputs/instrumentation-dex.txt
          grep -Fq com.shruggietech.glitchpad.testisolated.kotlin.jvm.internal.Intrinsics artifacts/android-release-inputs/instrumentation-dex.txt
          grep -Fq com.shruggietech.glitchpad.testisolated.androidx.tracing.Trace artifacts/android-release-inputs/instrumentation-dex.txt
          apksigner="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs "$RUNNER_TEMP/app-universal-release.apk" > artifacts/android-release-inputs/application-signature.txt
          "$apksigner" verify --verbose --print-certs artifacts/android-release-inputs/instrumentation.apk > artifacts/android-release-inputs/instrumentation-signature.txt
          apkanalyzer manifest print "$RUNNER_TEMP/app-universal-release.apk" > artifacts/android-release-inputs/application-manifest.xml
          apkanalyzer manifest print artifacts/android-release-inputs/instrumentation.apk > artifacts/android-release-inputs/instrumentation-manifest.xml
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const base='artifacts/android-release-inputs/';
          const hash=path=>crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const cert=path=>{const text=fs.readFileSync(path,'utf8');const digests=[...text.matchAll(/^Signer #\d+ certificate SHA-256 digest: ([a-f0-9]{64})$/gim)].map(m=>m[1].toLowerCase());if(digests.length!==1)throw Error('one verified signer required');return digests[0]};
          const applicationCertificate=cert(base+'application-signature.txt');
          if(applicationCertificate!==cert(base+'instrumentation-signature.txt'))throw Error('release instrumentation signer differs from canonical application');
          const target=fs.readFileSync(base+'application-manifest.xml','utf8');
          const test=fs.readFileSync(base+'instrumentation-manifest.xml','utf8');
          if(/android:debuggable="true"/.test(target)||!/android:debuggable="true"/.test(test)||!/android:testOnly="true"/.test(test)||!/android:targetPackage="com.shruggietech.glitchpad"/.test(test))throw Error('release/test manifest boundary mismatch');
          fs.writeFileSync(base+'identity.json',JSON.stringify({schema:1,source_commit:process.env.GITHUB_SHA,application_sha256:hash(process.env.RUNNER_TEMP+'/app-universal-release.apk'),instrumentation_sha256:hash(base+'instrumentation.apk'),r8_mapping_sha256:hash(base+'r8-mapping.txt'),signing_certificate_sha256:applicationCertificate,application_debuggable:false,minified:true,test_runtime_isolation:["kotlin","androidx.tracing"],test_dex_inventory_sha256:hash(base+"instrumentation-dex.txt")},null,2)+'\n');
          NODE

      - name: Build ARM64 APK
        run: |
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          pnpm tauri android build --apk --split-per-abi --target aarch64 --ci --config tauri.s022-android.conf.json
          cp crates/glitchpad-host/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk "$RUNNER_TEMP/app-arm64-release.apk"

      - name: Inspect raw signed packages and resolver groups
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          node scripts/check-android-package.mjs \
            --authority "${{ inputs.stage_release && 'official' || 'candidate' }}" \
            --output "$RUNNER_TEMP/android-inventories" \
            --artifact "universal=$RUNNER_TEMP/app-universal-release.apk" \
            --artifact "arm64=$RUNNER_TEMP/app-arm64-release.apk" \
            --artifact "play=$RUNNER_TEMP/app-universal-release.aab"

      - name: Collect locked dependency inputs
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          pnpm list --recursive --prod --json --depth Infinity > "$RUNNER_TEMP/pnpm-list.json"
          ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :app:dependencies --configuration universalReleaseRuntimeClasspath --no-daemon > "$RUNNER_TEMP/gradle-dependencies.txt"

      - name: Assemble canonical final bytes and evidence
        run: |
          node scripts/android/assemble-package.mjs \
            --contract packaging/android/package-contract.json \
            --output artifacts/android \
            --source-commit "$GITHUB_SHA" \
            --authority "${{ inputs.stage_release && 'official' || 'candidate' }}" \
            --input "universal=$RUNNER_TEMP/app-universal-release.apk" \
            --input "arm64=$RUNNER_TEMP/app-arm64-release.apk" \
            --input "play=$RUNNER_TEMP/app-universal-release.aab" \
            --inventory "universal=$RUNNER_TEMP/android-inventories/universal-inventory.json" \
            --inventory "arm64=$RUNNER_TEMP/android-inventories/arm64-inventory.json" \
            --inventory "play=$RUNNER_TEMP/android-inventories/play-inventory.json"
          node scripts/generate-android-sbom.mjs \
            "$RUNNER_TEMP/cargo-metadata.json" \
            "$RUNNER_TEMP/pnpm-list.json" \
            "$RUNNER_TEMP/gradle-dependencies.txt" \
            artifacts/android/artifact-digests.json \
            artifacts/android/glitchpad-android.cdx.json \
            "$GITHUB_SHA"

      - name: Validate canonical package set
        env:
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: node scripts/check-android-package.mjs --authority "${{ inputs.stage_release && 'official' || 'candidate' }}" --directory artifacts/android

      - name: Upload matching release test inputs
        uses: actions/upload-artifact@v7
        with:
          name: android-minified-release-inputs
          path: artifacts/android-release-inputs/
          if-no-files-found: error
          retention-days: 30

      - name: Upload governed Android package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.stage_release && 'glitchpad-0.3.0-android-community-release' || 'glitchpad-0.3.0-android-candidates' }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 30

  release-runtime:
    name: ${{ inputs.runtime_scope == 'startup' && 'Release startup diagnostic API' || 'Installed minified release API' }} ${{ matrix.api }}
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [24, 36]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Download unchanged canonical release package
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.stage_release && 'glitchpad-0.3.0-android-community-release' || 'glitchpad-0.3.0-android-candidates' }}
          path: ${{ runner.temp }}/canonical-android
      - name: Download matching release test inputs
        uses: actions/download-artifact@v8
        with:
          name: android-minified-release-inputs
          path: ${{ runner.temp }}/android-release-inputs
      - name: Verify immutable runtime inputs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const hash=path=>crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const base=process.env.RUNNER_TEMP+'/';
          const identity=JSON.parse(fs.readFileSync(base+'android-release-inputs/identity.json'));
          const manifest=JSON.parse(fs.readFileSync(base+'canonical-android/android-package-manifest.json'));
          const universal=manifest.artifacts.find(row=>row.role==='universal');
          if(identity.source_commit!==process.env.GITHUB_SHA||manifest.source_commit!==process.env.GITHUB_SHA||identity.application_sha256!==universal.sha256||hash(base+'canonical-android/'+universal.name)!==universal.sha256||hash(base+'android-release-inputs/instrumentation.apk')!==identity.instrumentation_sha256||hash(base+'android-release-inputs/r8-mapping.txt')!==identity.r8_mapping_sha256||!identity.minified||identity.application_debuggable!==false)throw Error('release runtime input identity mismatch');
          NODE
      - name: Enable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Operate installed minified canonical APK
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 36 && 'default' || 'google_apis' }}
          cores: 4
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan
          pre-emulator-launch-script: node scripts/configure-android-task-avd.mjs "$ANDROID_AVD_HOME/test.avd/config.ini"
          script: |
            set -e
            for package in com.google.android.gms com.google.android.googlequicksearchbox; do if node scripts/bounded-android-adb.mjs shell pm list packages "$package" | grep -Fq "package:$package"; then node scripts/bounded-android-adb.mjs shell pm disable-user --user 0 "$package"; fi; done
            node scripts/bounded-android-adb.mjs shell svc power stayon true
            node scripts/bounded-android-adb.mjs shell input keyevent 224
            if [ "${{ matrix.api }}" = 36 ]; then node scripts/bounded-android-adb.mjs shell svc bluetooth disable; node scripts/bounded-android-adb.mjs shell settings put global hide_error_dialogs 1; node scripts/bounded-android-adb.mjs shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS; fi
            mkdir -p "$RUNNER_TEMP/s048-release-runtime"
            node scripts/bounded-android-adb.mjs shell settings put secure show_ime_with_hard_keyboard 1
            node scripts/bounded-android-adb.mjs shell settings get secure show_ime_with_hard_keyboard > "$RUNNER_TEMP/s048-release-runtime/ime-environment.txt"
            grep -Fxq 1 "$RUNNER_TEMP/s048-release-runtime/ime-environment.txt"
            node scripts/bounded-android-adb.mjs shell settings get secure default_input_method >> "$RUNNER_TEMP/s048-release-runtime/ime-environment.txt"
            if [ "${{ inputs.runtime_scope || 'full' }}" = full ]; then bash scripts/run-android-release-tests.sh "${{ matrix.api }}" "$GITHUB_SHA" "$RUNNER_TEMP/canonical-android/glitchpad-0.3.0-android-universal.apk" "$RUNNER_TEMP/android-release-inputs/instrumentation.apk" "$RUNNER_TEMP/s048-release-startup" startup && mv "$RUNNER_TEMP/s048-release-startup/release-runtime.json" "$RUNNER_TEMP/s048-release-startup/startup-diagnostic.json"; fi
            bash scripts/run-android-release-tests.sh "${{ matrix.api }}" "$GITHUB_SHA" "$RUNNER_TEMP/canonical-android/glitchpad-0.3.0-android-universal.apk" "$RUNNER_TEMP/android-release-inputs/instrumentation.apk" "$RUNNER_TEMP/s048-release-runtime" "${{ inputs.runtime_scope || 'full' }}"
      - name: Retain every release-runtime attempt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.runtime_scope == 'startup' && 'android-minified-release-startup' || 'android-minified-release-runtime' }}-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/s048-release-runtime/**
            ${{ runner.temp }}/s048-release-startup/**
            ${{ runner.temp }}/android-release-inputs/identity.json
          if-no-files-found: error
          retention-days: 30
