name: ci
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [observers, source_binding, sdk_source, tap_observer]
        default: observers
permissions:
  contents: read
  actions: read
jobs:
  supporting-driver-policy:
    if: inputs.stage != 'source_binding'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Check real disconnected-child and receipt regressions
        run: node --test scripts/run-android-evidence.test.mjs scripts/test-android-recovery-evidence.mjs
      - name: Check Android runner policies
        run: python3 -m unittest discover -s scripts/tests -p 'test_android*.py'
  observer-diagnostic:
    if: inputs.stage == 'observers' || inputs.stage == 'tap_observer'
    needs: supporting-driver-policy
    name: Existing APK observer diagnostic (${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.stage == 'tap_observer' && '[36]' || '[24,36]') }}
    env:
      GLITCHPAD_BUILD_COMMIT: f572e0fbbd1d2978b6e4064a31817201834c8965
      DIAGNOSTIC_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v7
      - name: Check diagnostic Python syntax
        run: python3 -m py_compile .github/scripts/s047-observer-prepare.py .github/scripts/s047-observer-run.py .github/scripts/s047-observer-sign.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: actions/download-artifact@v8
        with:
          name: android-task-journeys-ordinary-api-36
          run-id: 42321138281
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Verify existing APK and prepare pinned JVM dependencies
        run: python3 .github/scripts/s047-observer-prepare.py
      - name: Compile only the changed instrumentation
        run: |
          ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :app:assembleUniversalDebugAndroidTest -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 -x :app:rustBuildUniversalDebug -x :app:rustBuildX86_64Debug --no-daemon
          mkdir -p "$RUNNER_TEMP/s047-observer-diagnostic"
          cp crates/glitchpad-host/gen/android/app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk "$RUNNER_TEMP/s047-observer-diagnostic/instrumentation.apk"
      - name: Prepare separately signed diagnostic copy and verify unchanged payload
        run: python3 .github/scripts/s047-observer-sign.py
      - name: Enable isolated emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated existing-APK observations
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 36 && 'default' || 'google_apis' }}
          cores: 4
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan
          pre-emulator-launch-script: node scripts/configure-android-task-avd.mjs "$ANDROID_AVD_HOME/test.avd/config.ini"
          script: python3 .github/scripts/s047-observer-run.py
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s047-existing-apk-observer-${{ matrix.api }}
          path: ${{ runner.temp }}/s047-observer-diagnostic/**
          if-no-files-found: warn
          retention-days: 7

  source-binding:
    if: inputs.stage == 'source_binding' || inputs.stage == 'tap_observer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Read the exact source baseline and rebind current references
        run: |
          git fetch --no-tags --depth=1 origin f572e0fbbd1d2978b6e4064a31817201834c8965
          python3 .github/scripts/s047-source-rebind.py
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const p='specs/047-android-task-completion/contracts/control-ledger.json';
          writeFileSync(p,JSON.stringify(JSON.parse(readFileSync(p,'utf8')),null,2)+'\n');
          NODE
          node .github/scripts/s047-source-audit.mjs
      - name: Retain source-only audit and proposed ledger data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s047-current-source-binding
          path: |
            .codex-tmp/s047/r28-hosted-source-rebind.json
            .codex-tmp/s047/current-control-reference-audit.json
            specs/047-android-task-completion/contracts/control-ledger.json
          retention-days: 7

  sdk-source:
    if: inputs.stage == 'sdk_source'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: actions/download-artifact@v8
        with:
          name: android-task-journeys-ordinary-api-36
          run-id: 42321138281
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Prepare pinned generated SDK inputs
        run: python3 .github/scripts/s047-observer-prepare.py
      - name: Format source-only receipt changes
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write scripts/bounded-android-adb.mjs scripts/run-android-evidence.test.mjs scripts/validate-android-recovery-evidence.mjs scripts/test-android-recovery-evidence.mjs
      - name: Compile actual Android sources and run clipboard store tests
        run: ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :glitchpad-android-source:testDebugUnitTest :app:assembleUniversalDebugAndroidTest -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 -x :app:rustBuildUniversalDebug -x :app:rustBuildX86_64Debug --no-daemon
      - name: Rebind and audit source-only references
        run: |
          git fetch --no-tags --depth=1 origin f572e0fbbd1d2978b6e4064a31817201834c8965
          python3 .github/scripts/s047-source-rebind.py
          node .github/scripts/s047-source-audit.mjs
      - name: Retain source-only validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s047-legacy-clipboard-source-validation
          path: |
            crates/glitchpad-android-source/android/build/test-results/testDebugUnitTest/**
            scripts/bounded-android-adb.mjs
            scripts/run-android-evidence.test.mjs
            scripts/validate-android-recovery-evidence.mjs
            scripts/test-android-recovery-evidence.mjs
            .codex-tmp/s047/r28-hosted-source-rebind.json
            .codex-tmp/s047/current-control-reference-audit.json
            specs/047-android-task-completion/contracts/control-ledger.json
          retention-days: 7
