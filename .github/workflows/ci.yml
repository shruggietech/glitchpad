          python - <<'PY'
          import hashlib, os, subprocess, tempfile, zipfile
          from pathlib import Path
          archive=Path('brand/enforcement/distributions/shruggie-brandbuilder-2.0.3.skill')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'f8ae954806e9797cbde8270a0660dc16dd6c4018df03f8003ca95e633efc073f'
          with tempfile.TemporaryDirectory() as location:
            with zipfile.ZipFile(archive) as bundle: bundle.extractall(location)
            with open(Path(os.environ['RUNNER_TEMP'])/'s047-recovery-preflight/brand-probe.log','w') as output:
              subprocess.run(['python',location+'/templates/probe.py'],check=True,stdout=output,stderr=subprocess.STDOUT)
          PY
          python scripts/verify-brandbuilder.py 2>&1 | tee "$RUNNER_TEMP/s047-recovery-preflight/brand-contract.log"
      - name: Format affected sources with the repository pin
        run: pnpm exec prettier --write scripts/check-app-layout.mjs scripts/run-android-evidence.test.mjs apps/glitchpad/src/styles.css apps/glitchpad/src/components/TaskSurface.tsx apps/glitchpad/src/components/TaskSurface.test.tsx apps/glitchpad/src/components/LargeTextSurface.tsx apps/glitchpad/src/components/LargeTextSurface.test.tsx scripts/check-image-layout.mjs apps/glitchpad/src/App.tsx apps/glitchpad/src/S047-shell.test.tsx
      - name: Reproduce pointer focus movement with the previous TaskSurface
        if: inputs.stage == 'touch_preflight'
        run: |
          cp apps/glitchpad/src/components/TaskSurface.tsx "$RUNNER_TEMP/s047-fixed-task-surface.tsx"
          git fetch --no-tags --depth=1 origin 1f4b05170567fa19b97f4e4dc92e8730822b0441
          git show 1f4b05170567fa19b97f4e4dc92e8730822b0441:apps/glitchpad/src/components/TaskSurface.tsx > apps/glitchpad/src/components/TaskSurface.tsx
          set +e
          pnpm --dir apps/glitchpad exec vitest run src/components/TaskSurface.test.tsx --testNamePattern='defers touch focus until button activation|settles rounded CSSOM measurements' --reporter=json --outputFile="$RUNNER_TEMP/s047-recovery-preflight/touch-red.json" > "$RUNNER_TEMP/s047-recovery-preflight/touch-red.log" 2>&1
          red_exit=$?
          set -e
          cp "$RUNNER_TEMP/s047-fixed-task-surface.tsx" apps/glitchpad/src/components/TaskSurface.tsx
          test "$red_exit" -ne 0
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/s047-recovery-preflight/touch-red.json','utf8'));
          assert.equal(r.numFailedTests,3);
          assert.ok(r.testResults.flatMap(t=>t.assertionResults).some(a=>a.status==='failed'&&a.fullName.includes('rounded CSSOM')));
          NODE

      - name: Reproduce large-text modal focus escape with previous source
        run: |
          cp apps/glitchpad/src/components/LargeTextSurface.tsx "$RUNNER_TEMP/s047-fixed-large-text.tsx"
          git fetch --no-tags --depth=1 origin 789ad693bc1d72dfcbbe74a4aad24ba30ce337c5
          git show 789ad693bc1d72dfcbbe74a4aad24ba30ce337c5:apps/glitchpad/src/components/LargeTextSurface.tsx > apps/glitchpad/src/components/LargeTextSurface.tsx
          set +e
          pnpm --dir apps/glitchpad exec vitest run src/components/LargeTextSurface.test.tsx --testNamePattern='keeps successful line-navigation focus' > "$RUNNER_TEMP/s047-recovery-preflight/large-text-red.log" 2>&1
          red_exit=$?
          set -e
          cp "$RUNNER_TEMP/s047-fixed-large-text.tsx" apps/glitchpad/src/components/LargeTextSurface.tsx
          test "$red_exit" -ne 0
          grep -F 'keeps successful line-navigation focus' "$RUNNER_TEMP/s047-recovery-preflight/large-text-red.log"
      - name: Reproduce duplicate application-panel focus restoration
        run: |
          cp apps/glitchpad/src/App.tsx "$RUNNER_TEMP/s047-fixed-app-focus.tsx"
          git fetch --no-tags --depth=1 origin 2b44940ae4b3c6f81f4d663d4d8e104b2675a239
          git show 2b44940ae4b3c6f81f4d663d4d8e104b2675a239:apps/glitchpad/src/App.tsx > apps/glitchpad/src/App.tsx
          set +e
          pnpm --dir apps/glitchpad exec vitest run src/S047-shell.test.tsx --testNamePattern='keeps the completed Add handoff when an earlier application-panel frame runs late' > "$RUNNER_TEMP/s047-recovery-preflight/app-focus-red.log" 2>&1
          red_exit=$?
          set -e
          cp "$RUNNER_TEMP/s047-fixed-app-focus.tsx" apps/glitchpad/src/App.tsx
          test "$red_exit" -ne 0
          grep -F 'keeps the completed Add handoff when an earlier application-panel frame runs late' "$RUNNER_TEMP/s047-recovery-preflight/app-focus-red.log"
      - name: Validate complete frontend and corrected production recovery profiles
        run: |
          pnpm run check:frontend 2>&1 | tee "$RUNNER_TEMP/s047-recovery-preflight/frontend-green.log"
          pnpm run check:images 2>&1 | tee "$RUNNER_TEMP/s047-recovery-preflight/images-green.log"
          node scripts/check-app-layout.mjs --group recovery --receipt "$RUNNER_TEMP/s047-recovery-preflight/recovery-modern.json" 2>&1 | tee "$RUNNER_TEMP/s047-recovery-preflight/modern.log"
          mkdir -p /tmp/glitchpad-browser-compat/client
          npm install --prefix /tmp/glitchpad-browser-compat/client --ignore-scripts --no-audit --no-fund puppeteer-core@1.9.0
          curl -fsSLo /tmp/glitchpad-chromium69.zip https://storage.googleapis.com/chromium-browser-snapshots/Linux_x64/576753/chrome-linux.zip
          sha256sum /tmp/glitchpad-chromium69.zip > "$RUNNER_TEMP/s047-recovery-preflight/chromium69-archive.sha256"
          python -m zipfile -e /tmp/glitchpad-chromium69.zip /tmp/glitchpad-browser-compat/chromium/linux-576753
          chmod +x /tmp/glitchpad-browser-compat/chromium/linux-576753/chrome-linux/chrome
          node scripts/check-app-layout.mjs --legacy --group recovery --receipt "$RUNNER_TEMP/s047-recovery-preflight/recovery-chromium69.json" 2>&1 | tee "$RUNNER_TEMP/s047-recovery-preflight/chromium69.log"
      - name: Bind exact current source references
        run: |
          git fetch --no-tags --depth=1 origin 8eef5f589cab9a17c15ca1937fc0c65223cfabe0
          python3 .github/scripts/s047-source-rebind.py
          node .github/scripts/s047-source-audit.mjs
      - name: Retain actual production recovery measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s047-recovery-preflight
          path: |
            ${{ runner.temp }}/s047-recovery-preflight/**
            apps/glitchpad/src/styles.css
            apps/glitchpad/src/components/TaskSurface.tsx
            apps/glitchpad/src/components/TaskSurface.test.tsx
            apps/glitchpad/src/components/LargeTextSurface.tsx
            apps/glitchpad/src/components/LargeTextSurface.test.tsx
            apps/glitchpad/src/App.tsx
            apps/glitchpad/src/S047-shell.test.tsx
            scripts/check-image-layout.mjs
            scripts/check-app-layout.mjs
            scripts/run-android-evidence.test.mjs
            .codex-tmp/s047/r28-hosted-source-rebind.json
            .codex-tmp/s047/current-control-reference-audit.json
            specs/047-android-task-completion/contracts/control-ledger.json
          retention-days: 7

  working-candidate:
    if: inputs.stage == 'working_candidate' || inputs.stage == 'geometry_candidate' || inputs.stage == 'legacy_capture' || inputs.stage == 'bootstrap_viewport'
    needs: supporting-driver-policy
    env:
      ANDROID_S047_BACK_DIAGNOSTIC: 'false'
      GLITCHPAD_BUILD_COMMIT: ${{ inputs.stage == 'bootstrap_viewport' && '3a23dd5abd19213927181b37957c56bb82254836' || inputs.stage == 'legacy_capture' && 'f7930b8911df18eb09bbb920747a6769f006f7a3' || github.event.pull_request.head.sha || github.sha }}
      VITE_GLITCHPAD_BUILD_COMMIT: ${{ inputs.stage == 'bootstrap_viewport' && '3a23dd5abd19213927181b37957c56bb82254836' || inputs.stage == 'legacy_capture' && 'f7930b8911df18eb09bbb920747a6769f006f7a3' || github.event.pull_request.head.sha || github.sha }}
    name: Focused current-source layout (API ${{ matrix.api-level }})
    # Explicit KVM access keeps the guest Android versions and test budgets unchanged.
    # Focused API 24/API 36 diagnostics completed on this accelerated Linux host.
    runs-on: ubuntu-latest
    # Retain the full composed campaign after the observed build/emulator setup cost.
    # Per-action and per-process attempt limits remain enforced by their runners.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(inputs.stage == 'bootstrap_viewport' && '[36]' || inputs.stage == 'legacy_capture' && '[24]' || '[24,36]') }}
        role: [ordinary]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        if: inputs.stage != 'legacy_capture' && inputs.stage != 'bootstrap_viewport'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Verify hosted offline controller before the APK build
        if: matrix.api-level == 24 && matrix.role == 'ordinary'
        run: node --test scripts/android-offline-mode.test.mjs

      - name: Install dependencies
        if: inputs.stage != 'legacy_capture' && inputs.stage != 'bootstrap_viewport'
        run: pnpm install --frozen-lockfile

      - name: Add Rust Android emulator target
        if: inputs.stage != 'legacy_capture' && inputs.stage != 'bootstrap_viewport'
        run: rustup target add x86_64-linux-android

      - name: Cache Rust dependencies
        if: inputs.stage != 'legacy_capture' && inputs.stage != 'bootstrap_viewport'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-x86_64-api-${{ matrix.api-level }}
          cache-on-failure: true

      - name: Build emulator APK and provider unit tests
        if: inputs.stage != 'legacy_capture' && inputs.stage != 'bootstrap_viewport'
        env:
          VITE_GLITCHPAD_RECOVERY_PROBES: ${{ matrix.role == 'fault_probe' && '1' || '0' }}
        run: |
          export NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          pnpm tauri android build --debug --apk --target x86_64 --ci
          node scripts/check-android-build-role.mjs "${{ matrix.role }}"
          node --test scripts/configure-android-task-avd.test.mjs
          ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :glitchpad-android-source:testDebugUnitTest --no-daemon
          ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :app:assembleUniversalDebugAndroidTest -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 -x :app:rustBuildUniversalDebug -x :app:rustBuildX86_64Debug --no-daemon

      - name: Download unchanged qualified-source APK pair
        if: inputs.stage == 'legacy_capture' || inputs.stage == 'bootstrap_viewport'
        uses: actions/download-artifact@v8
        with:
          name: working-layout-api-36
          run-id: ${{ inputs.stage == 'bootstrap_viewport' && 42358143054 || 42355174592 }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/s047-existing-apks
      - name: Verify original APK receipt and retain separate driver identity
        if: inputs.stage == 'legacy_capture' || inputs.stage == 'bootstrap_viewport'
        run: |
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          original=Path(os.environ['RUNNER_TEMP'])/'s047-existing-apks'
          receipts=list(original.rglob('tested-apk-receipt.json'))
          assert len(receipts)==1
          receipt_path=receipts[0]; receipt=json.loads(receipt_path.read_text())
          assert receipt['source_commit']==os.environ['GLITCHPAD_BUILD_COMMIT']
          assert receipt['candidate_build_variant']=='ordinary'
          assert {a['kind'] for a in receipt['artifacts']}=={'application','instrumentation'}
          destinations={'application':'app/build/outputs/apk/universal/debug/app-universal-debug.apk','instrumentation':'app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk'}
          for item in receipt['artifacts']:
            source=receipt_path.parent/item['filename']; data=source.read_bytes()
            assert len(data)==item['byte_count']
            assert hashlib.sha256(data).hexdigest()==item['sha256']
            target=Path('crates/glitchpad-host/gen/android')/destinations[item['kind']]
            target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source,target)
          provenance={'product_source':receipt['source_commit'],'driver_source':os.environ['GITHUB_SHA'],'original_run':42358143054 if os.environ['GLITCHPAD_BUILD_COMMIT']=='3a23dd5abd19213927181b37957c56bb82254836' else 42355174592,'original_api':36,'destination_api':24,'apk_bytes_unchanged':True,'scope':'Existing exact product bytes; fresh actual API24 supporting-capture and geometry isolation. Final public candidate must be rebuilt and qualified independently.'}
          (Path(os.environ['RUNNER_TEMP'])/'s047-existing-apk-provenance.json').write_text(json.dumps(provenance,indent=2)+'\n')
          PY

      - name: Enable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate readonly observer syntax
        if: inputs.stage == 'bootstrap_viewport'
        run: node --check .github/scripts/s047-bootstrap-viewport-observer.mjs

      - name: Inspect actual cold and recreated recovery viewport
        if: inputs.stage == 'bootstrap_viewport'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: default
          cores: 4
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan
          pre-emulator-launch-script: node scripts/configure-android-task-avd.mjs "$ANDROID_AVD_HOME/test.avd/config.ini"
          script: node .github/scripts/s047-bootstrap-viewport-observer.mjs

      - name: Run provider, resolver, delivery, and restoration evidence
        if: inputs.stage != 'bootstrap_viewport'
        env:
          GLITCHPAD_RECOVERY_PROBE_VARIANT: ${{ matrix.role == 'fault_probe' && 'compiled_test_only' || 'none' }}
          GLITCHPAD_CANDIDATE_ROLE: ${{ matrix.role }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          # Keep API 24's older Chrome coverage. API 36 uses the official AOSP image
          # to exercise offline framework behavior without Google first-boot work.
          target: ${{ matrix.api-level == 36 && 'default' || 'google_apis' }}
          cores: 4
          emulator-boot-timeout: 900
          disable-animations: true
          # The deprecated indirect renderer crashed during WebView teardown on both
          # governed API levels. Use Android's supported software renderer and keep
          # Vulkan disabled for this headless GLES test workload.
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan
          # Set hardware before boot; emulator-generated properties override -prop.
          pre-emulator-launch-script: node scripts/configure-android-task-avd.mjs "$ANDROID_AVD_HOME/test.avd/config.ini"
          script: |
            # These offline tests do not need Google services. Avoid their first-boot
            # work starving instrumentation on the disposable hosted emulator.
            set -e; for package in com.google.android.gms com.google.android.googlequicksearchbox; do if node scripts/bounded-android-adb.mjs shell pm list packages "$package" | grep -Fq "package:$package"; then node scripts/bounded-android-adb.mjs shell pm disable-user --user 0 "$package"; fi; done
            # The API 36 system Bluetooth service can crash and leave its error dialog above
            # the AppFrame activity, stealing input focus from the WebView under test.
            node scripts/capture-android-navigation.mjs "$RUNNER_TEMP/s047-navigation-environment.json"
            node scripts/bounded-android-adb.mjs shell svc power stayon true
            node scripts/bounded-android-adb.mjs shell input keyevent 224
            if [ "${{ matrix.api-level }}" = "36" ]; then node scripts/bounded-android-adb.mjs shell svc bluetooth disable; fi
            # Follow AOSP CTS input-test setup: suppress later system crash/ANR dialogs and
            # close any dialog already present before testing the foreground WebView.
            if [ "${{ matrix.api-level }}" = "36" ]; then node scripts/bounded-android-adb.mjs shell settings put global hide_error_dialogs 1 && node scripts/bounded-android-adb.mjs shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS; fi
            bash scripts/run-android-connected-tests.sh
            apkanalyzer manifest print "$RUNNER_TEMP/android-tested-candidate/application.apk" > "$RUNNER_TEMP/s047-application-manifest.xml"
            grep -Eq 'android:enableOnBackInvokedCallback="true"' "$RUNNER_TEMP/s047-application-manifest.xml"
            node scripts/bounded-android-adb.mjs shell settings put secure show_ime_with_hard_keyboard 1
            if [ "${{ matrix.api-level }}" = "36" ]; then node scripts/bounded-android-adb.mjs shell cmd overlay list | grep -F 'com.android.internal.display.cutout.emulation.corner' && node scripts/bounded-android-adb.mjs shell cmd overlay enable --user 0 com.android.internal.display.cutout.emulation.corner && node scripts/bounded-android-adb.mjs shell cmd overlay list | grep -F '[x] com.android.internal.display.cutout.emulation.corner'; fi
            # Exercise API 36 AppFrame on a fresh emulator, before long provider suites.
            if [ "${{ matrix.api-level }}" = "36" ]; then node scripts/bounded-android-adb.mjs shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS && node scripts/bounded-android-adb.mjs shell input keyevent KEYCODE_WAKEUP && node scripts/bounded-android-adb.mjs shell wm dismiss-keyguard; fi
            if [ "${{ matrix.api-level }}" = "36" ]; then ime_id='com.shruggietech.glitchpad.test/com.shruggietech.glitchpad.shell.FixtureInputMethodService'; for attempt in $(seq 1 30); do if node scripts/bounded-android-adb.mjs shell ime list -s -a | grep -Fq "$ime_id"; then break; fi; sleep 1; done; node scripts/bounded-android-adb.mjs shell ime list -s -a | grep -Fq "$ime_id" && node scripts/bounded-android-adb.mjs shell ime enable "$ime_id" && node scripts/bounded-android-adb.mjs shell ime set "$ime_id" && node scripts/bounded-android-adb.mjs shell settings get secure default_input_method | grep -Fqx "$ime_id"; fi
            if [ "${{ matrix.api-level }}" = "36" ]; then ANDROID_INSTRUMENTATION_PRESERVE_TEST_INPUT_METHOD=true bash scripts/run-android-instrumentation.sh "$RUNNER_TEMP/appframe-evidence.txt" 'appframe_evidence=' -e waitForActivitiesToComplete false -e class com.shruggietech.glitchpad.shell.BrandBuilderAppFrameInstrumentedTest; fi
            if [ "${{ matrix.api-level }}" = "36" ]; then node scripts/bounded-android-adb.mjs shell ime reset; fi
            ANDROID_INSTRUMENTATION_RESET_APP_DATA=true bash scripts/run-android-instrumentation.sh "$RUNNER_TEMP/s047-layout.txt" 's047_journey_evidence=' -e waitForActivitiesToComplete false -e s047 true -e expectedSource "$GLITCHPAD_BUILD_COMMIT" -e expectedRole ordinary -e class com.shruggietech.glitchpad.source.AndroidDeliveryInstrumentedTest#s047LayoutJourney

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.stage == 'bootstrap_viewport' && 'bootstrap-viewport-observer' || 'working-layout' }}-api-${{ matrix.api-level }}
          path: |
            crates/glitchpad-host/gen/android/app/build/reports/androidTests/**
            crates/glitchpad-host/gen/android/app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/*.txt
            ${{ runner.temp }}/*.png
            ${{ runner.temp }}/*.json
            ${{ runner.temp }}/*.xml
            ${{ runner.temp }}/android-tested-candidate/**
            ${{ runner.temp }}/s047-bootstrap-viewport/**
          if-no-files-found: warn
          retention-days: 7



  font-configuration-probe:
    if: inputs.stage == 'font_configuration'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GLITCHPAD_BUILD_COMMIT: '3a23dd5abd19213927181b37957c56bb82254836'
      S047_PRODUCT_SOURCE: '3a23dd5abd19213927181b37957c56bb82254836'
      S047_ORIGINAL_APK_SHA256: '213cdbc7a45d64dcdac45475023c7c157db7c2fb5abf0e719069a19e4db343c0'
      S047_ORIGINAL_APK_BYTES: '231141070'
      S047_ORIGINAL_ARTIFACT: '13569117250'
      S047_REBUILD_JVM: 'true'
    steps:
      - uses: actions/checkout@v7
