  recovery-preflight:
    if: inputs.stage == 'recovery_preflight' || inputs.stage == 'touch_preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
