name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Format current release sources and derived documentation
        run: |
          node site/scripts/prebuild.mjs
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only','84ba6ce0afb1854051b55711c6c9047306a35a42','HEAD'],text=True).splitlines()+subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines())
          paths=sorted(p for p in paths if p!='.github/workflows/ci.yml' and p.endswith(('.md','.mdx','.json','.yml','.yaml','.mjs','.tsx')))
          subprocess.run(['pnpm','exec','prettier','--write',*paths],check=True)
          PY
          pnpm check:community-release
          pnpm check:public-release
          pwsh -NoLogo -NoProfile -NonInteractive -File scripts/check-version.ps1
      - name: Export source-bound formatted files
        if: always()
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,json,hashlib,base64
          files=[]
          for name in subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines():
            if name=='.github/workflows/ci.yml': continue
            before=subprocess.check_output(['git','show','HEAD:'+name])
            data=pathlib.Path(name).read_bytes()
            files.append(dict(path=name,before_sha256=hashlib.sha256(before).hexdigest(),sha256=hashlib.sha256(data).hexdigest(),base64=base64.b64encode(data).decode()))
          pathlib.Path('release-formatted.json').write_text(json.dumps(dict(source_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),files=files)))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-formatted
          path: release-formatted.json
          if-no-files-found: error
