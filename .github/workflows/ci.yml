name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Refresh compatible dependency locks
        run: |
          set -euo pipefail
          rustup default 1.96.0
          cargo metadata --format-version 1 > /tmp/cargo-metadata.json
          cargo update -p uuid --precise 1.29.2
          cp Cargo.lock fuzz/Cargo.lock
          cargo metadata --manifest-path fuzz/Cargo.toml --format-version 1 > /tmp/fuzz-metadata.json
          cargo fmt --all
          cargo check -p glitchpad-core --all-targets --locked
          node --test scripts/check-vendored-patches.test.mjs
          node scripts/check-fuzz-lock.mjs
          pnpm install --frozen-lockfile
          node .github/dependency-refresh.mjs
          pnpm exec prettier --write package.json apps/glitchpad/package.json site/package.json packaging/dependabot-20261110-notice-sources.json vendor/provenance.json .github/dependabot.yml
      - name: Focused frontend and validation contracts
        run: |
          pnpm check:frontend
          node --test scripts/check-validation.test.mjs scripts/check-vendored-patches.test.mjs
          pnpm docs:format
      - name: Export source-bound generated changes
        if: always()
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,json,hashlib,base64
          files=[]
          for name in sorted(set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()+subprocess.check_output(['git','ls-files','--others','--exclude-standard','packaging'],text=True).splitlines())):
            if name.startswith('.github/'): continue
            old=subprocess.run(['git','show','HEAD:'+name],capture_output=True)
            before=old.stdout if old.returncode==0 else None
            data=pathlib.Path(name).read_bytes()
            files.append(dict(path=name,before_sha256=hashlib.sha256(before).hexdigest() if before is not None else None,sha256=hashlib.sha256(data).hexdigest(),base64=base64.b64encode(data).decode()))
          pathlib.Path('dependency-generated.json').write_text(json.dumps(dict(source_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),files=files)))
          print('Exported',len(files),'source-bound files')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-generated
          path: dependency-generated.json
          if-no-files-found: error

