name: ci
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [observers, source_binding, sdk_source, tap_observer, metadata_observer, clipboard_observer, aggregate, working_candidate, converge_context, geometry_candidate, recovery_preflight, legacy_capture, bootstrap_viewport, font_configuration, handoff_probe, touch_preflight, fixture_preflight, legacy_cdp]
        default: observers
      candidate_source:
        description: Exact public candidate SHA for aggregate only
        type: string
        required: false
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  supporting-driver-policy:
    if: inputs.stage != 'converge_context'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Reproduce newline feature-list rejection before the correction
        run: |
          mkdir -p "$RUNNER_TEMP/s047-capture-v2"
          cp scripts/run-android-connected-tests.sh "$RUNNER_TEMP/s047-fixed-feature-parser.sh"
          git fetch --no-tags --depth=1 origin f7930b8911df18eb09bbb920747a6769f006f7a3
          git show f7930b8911df18eb09bbb920747a6769f006f7a3:scripts/run-android-connected-tests.sh > scripts/run-android-connected-tests.sh
          set +e
          node --test --test-name-pattern='captures exact queried installed bytes with run-as' scripts/run-android-evidence.test.mjs > "$RUNNER_TEMP/s047-capture-v2/feature-parser-red.log" 2>&1
          red_exit=$?
          set -e
          cp "$RUNNER_TEMP/s047-fixed-feature-parser.sh" scripts/run-android-connected-tests.sh
          test "$red_exit" -ne 0
          grep -F '1 !== 0' "$RUNNER_TEMP/s047-capture-v2/feature-parser-red.log"
          grep -F 'adb_shell_v2_run_as_cat' "$RUNNER_TEMP/s047-capture-v2/feature-parser-red.log"
      - name: Prove raw capture misses a remote error after valid bytes
        run: |
          mkdir -p "$RUNNER_TEMP/s047-capture-v2"
          cp scripts/run-android-connected-tests.sh "$RUNNER_TEMP/s047-fixed-capture-v2.sh"
          git fetch --no-tags --depth=1 origin 8eef5f589cab9a17c15ca1937fc0c65223cfabe0
          git show 8eef5f589cab9a17c15ca1937fc0c65223cfabe0:scripts/run-android-connected-tests.sh > scripts/run-android-connected-tests.sh
          set +e
          node --test --test-name-pattern='refuses run-as fallback remote error after matching output' scripts/run-android-evidence.test.mjs > "$RUNNER_TEMP/s047-capture-v2/remote-error-red.log" 2>&1
          red_exit=$?
          set -e
          cp "$RUNNER_TEMP/s047-fixed-capture-v2.sh" scripts/run-android-connected-tests.sh
          test "$red_exit" -ne 0
          grep -F '0 !== 1' "$RUNNER_TEMP/s047-capture-v2/remote-error-red.log"
      - name: Format capture regression with repository pin
        run: npx --yes --ignore-scripts prettier@3.9.9 --write scripts/run-android-evidence.test.mjs scripts/validate-android-recovery-evidence.mjs scripts/test-android-recovery-evidence.mjs
      - name: Check real disconnected-child and receipt regressions
        run: node --test scripts/run-android-evidence.test.mjs scripts/test-android-recovery-evidence.mjs scripts/check-android-package.test.mjs 2>&1 | tee "$RUNNER_TEMP/s047-capture-v2/green.log"
      - name: Check Android runner policies
        run: python3 -m unittest discover -s scripts/tests -p 'test_android*.py'
      - name: Retain capture protocol source verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s047-capture-v2-source-preflight
          path: |
            scripts/run-android-connected-tests.sh
            scripts/run-android-evidence.test.mjs
            ${{ runner.temp }}/s047-capture-v2/**
          retention-days: 7
  observer-diagnostic:
    if: inputs.stage == 'observers' || inputs.stage == 'tap_observer' || inputs.stage == 'metadata_observer' || inputs.stage == 'clipboard_observer'
    needs: supporting-driver-policy
    name: Existing APK observer diagnostic (${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.stage == 'clipboard_observer' && '[24,36]' || (inputs.stage == 'tap_observer' || inputs.stage == 'metadata_observer') && '[36]' || '[24,36]') }}
    env:
      GLITCHPAD_BUILD_COMMIT: ${{ inputs.stage == 'clipboard_observer' && '3c40eedeabd87955d4170e462aeda8553b44843d' || 'f572e0fbbd1d2978b6e4064a31817201834c8965' }}
      S047_PRODUCT_SOURCE: ${{ inputs.stage == 'clipboard_observer' && '3c40eedeabd87955d4170e462aeda8553b44843d' || 'f572e0fbbd1d2978b6e4064a31817201834c8965' }}
      S047_ORIGINAL_APK_SHA256: ${{ inputs.stage == 'clipboard_observer' && '53b8827869d59f8b68c5e6a2dc2947fda42a352f72acdc9df295fbee96624b59' || '939eee7b4ee3d211fb5bf82da140690248b3b5c12e6b07f40a76f91f6c9dc266' }}
      S047_ORIGINAL_APK_BYTES: ${{ inputs.stage == 'clipboard_observer' && '230722006' || '230309962' }}
      S047_ORIGINAL_ARTIFACT: ${{ inputs.stage == 'clipboard_observer' && '13559868075' || '13555731908' }}
      S047_REBUILD_JVM: ${{ inputs.stage == 'clipboard_observer' && 'true' || 'false' }}
      DIAGNOSTIC_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v7
      - name: Select isolated metadata diagnostic fixture
        if: inputs.stage == 'metadata_observer' || inputs.stage == 'clipboard_observer'
        run: cp ${{ inputs.stage == 'clipboard_observer' && '.github/scripts/s047-clipboard-prototype.kt' || '.github/scripts/s047-metadata-prototype.kt' }} crates/glitchpad-host/gen/android/app/src/androidTest/java/com/shruggietech/glitchpad/source/AndroidDeliveryInstrumentedTest.kt
      - name: Check diagnostic Python syntax
        run: python3 -m py_compile .github/scripts/s047-observer-prepare.py .github/scripts/s047-observer-run.py .github/scripts/s047-observer-sign.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.stage == 'clipboard_observer' && 'android-task-journeys-ordinary-api-24' || 'android-task-journeys-ordinary-api-36' }}
          run-id: ${{ inputs.stage == 'clipboard_observer' && '42335016382' || '42321138281' }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Verify existing APK and prepare pinned JVM dependencies
        run: python3 .github/scripts/s047-observer-prepare.py
      - name: Compile changed JVM and instrumentation sources
        run: |
          if [ "$S047_REBUILD_JVM" = true ]; then ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :app:assembleUniversalDebug -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 -x :app:rustBuildUniversalDebug -x :app:rustBuildX86_64Debug --no-daemon; fi
          ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :app:assembleUniversalDebugAndroidTest -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 -x :app:rustBuildUniversalDebug -x :app:rustBuildX86_64Debug --no-daemon
          mkdir -p "$RUNNER_TEMP/s047-observer-diagnostic"
          cp crates/glitchpad-host/gen/android/app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk "$RUNNER_TEMP/s047-observer-diagnostic/instrumentation.apk"
      - name: Prepare separately signed diagnostic copy and verify unchanged payload
        run: python3 .github/scripts/s047-observer-sign.py
      - name: Enable isolated emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated existing-APK observations
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == 36 && 'default' || 'google_apis' }}
          cores: 4
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan
          pre-emulator-launch-script: node scripts/configure-android-task-avd.mjs "$ANDROID_AVD_HOME/test.avd/config.ini"
          script: python3 ${{ inputs.stage == 'clipboard_observer' && '.github/scripts/s047-clipboard-run.py' || inputs.stage == 'metadata_observer' && '.github/scripts/s047-metadata-run.py' || '.github/scripts/s047-observer-run.py' }}
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s047-existing-apk-observer-${{ matrix.api }}
          path: ${{ runner.temp }}/s047-observer-diagnostic/**
          if-no-files-found: warn
          retention-days: 7

  source-binding:
    if: inputs.stage == 'source_binding' || inputs.stage == 'tap_observer' || inputs.stage == 'geometry_candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Format capture source before hashing
        run: npx --yes --ignore-scripts prettier@3.9.9 --write scripts/run-android-evidence.test.mjs scripts/validate-android-recovery-evidence.mjs scripts/test-android-recovery-evidence.mjs specs/047-android-task-completion/validation.md specs/047-android-task-completion/handoff.md specs/047-android-task-completion/contracts/task-and-evidence.md
      - name: Read the exact source baseline and rebind current references
        run: |
          git fetch --no-tags --depth=1 origin 8eef5f589cab9a17c15ca1937fc0c65223cfabe0
          python3 .github/scripts/s047-source-rebind.py
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const p='specs/047-android-task-completion/contracts/control-ledger.json';
          writeFileSync(p,JSON.stringify(JSON.parse(readFileSync(p,'utf8')),null,2)+'\n');
          NODE
          node .github/scripts/s047-source-audit.mjs
      - name: Retain source-only audit and proposed ledger data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s047-current-source-binding
          path: |
            specs/047-android-task-completion/validation.md
            specs/047-android-task-completion/handoff.md
            specs/047-android-task-completion/contracts/task-and-evidence.md
            .codex-tmp/s047/r28-hosted-source-rebind.json
            .codex-tmp/s047/current-control-reference-audit.json
            specs/047-android-task-completion/contracts/control-ledger.json
            scripts/run-android-evidence.test.mjs
            scripts/run-android-connected-tests.sh
            scripts/validate-android-recovery-evidence.mjs
            scripts/test-android-recovery-evidence.mjs
          retention-days: 7

  sdk-source:
    if: inputs.stage == 'sdk_source'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: actions/download-artifact@v8
        with:
          name: android-task-journeys-ordinary-api-36
          run-id: 42321138281
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original
      - name: Prepare pinned generated SDK inputs
        run: python3 .github/scripts/s047-observer-prepare.py
      - name: Install Linux libraries for bounded source checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Cache source validation Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-ubuntu-latest
          cache-on-failure: true
      - name: Format current working sources
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write scripts/bounded-android-adb.mjs scripts/run-android-evidence.test.mjs scripts/validate-android-recovery-evidence.mjs scripts/test-android-recovery-evidence.mjs scripts/check-android-package.mjs scripts/check-android-package.test.mjs packaging/android/package-contract.json packaging/android/intent-map.json apps/glitchpad/src/components/TaskSurface.tsx apps/glitchpad/src/components/TaskSurface.test.tsx apps/glitchpad/src/domain/large-text-gateway.ts apps/glitchpad/src/domain/large-text-gateway.test.ts scripts/check-app-layout.mjs
          cargo fmt --all
      - name: Reproduce late Add focus before the guard correction
        run: |
          mkdir -p "$RUNNER_TEMP/s047-source-preflight"
          cp apps/glitchpad/src/components/TaskSurface.tsx "$RUNNER_TEMP/s047-fixed-task-surface.tsx"
          git fetch --no-tags --depth=1 origin 89bff4ddfaad77da028deb1c927058711a83937c
          git show 89bff4ddfaad77da028deb1c927058711a83937c:apps/glitchpad/src/components/TaskSurface.tsx > apps/glitchpad/src/components/TaskSurface.tsx
          set +e
          pnpm --filter @shruggietech/glitchpad exec vitest run --maxWorkers=2 src/components/TaskSurface.test.tsx -t 'keeps a completed Add document trigger handoff when an older task closes late' > "$RUNNER_TEMP/s047-source-preflight/focus-red.log" 2>&1
          red_exit=$?
          set -e
          cp "$RUNNER_TEMP/s047-fixed-task-surface.tsx" apps/glitchpad/src/components/TaskSurface.tsx
          test "$red_exit" -ne 0
          grep -F 'keeps a completed Add document trigger handoff' "$RUNNER_TEMP/s047-source-preflight/focus-red.log"
          grep -F 'Expected element with focus' "$RUNNER_TEMP/s047-source-preflight/focus-red.log"
      - name: Check full current frontend source and compatibility callers
        run: pnpm run check:frontend 2>&1 | tee "$RUNNER_TEMP/s047-source-preflight/frontend-green.log"
      - name: Check bounded codec, wire compatibility and IME conformance
        run: |
          cp .github/workflows/ci.yml "$RUNNER_TEMP/s047-private-workflow.yml"
          trap 'cp "$RUNNER_TEMP/s047-private-workflow.yml" .github/workflows/ci.yml' EXIT
          cp .github/scripts/s047-public-ci.yml .github/workflows/ci.yml
          bash -n scripts/run-android-connected-tests.sh scripts/run-android-instrumentation.sh
          cargo fmt --all -- --check
          cargo test -p glitchpad-android-source --locked --lib range_transport_tests
          cargo test -p glitchpad-host --locked --lib android_range_response::tests
          cargo test -p glitchpad-host --locked --test performance_conformance
          cargo clippy -p glitchpad-android-source -p glitchpad-host --all-targets --all-features --locked -- -D warnings
          rustup target add x86_64-linux-android
          cargo check -p glitchpad-android-source --target x86_64-linux-android --locked
      - name: Compile actual Android sources and run clipboard store tests
        run: ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :glitchpad-android-source:testDebugUnitTest :app:assembleUniversalDebugAndroidTest -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 -x :app:rustBuildUniversalDebug -x :app:rustBuildX86_64Debug --no-daemon
      - name: Rebind and audit source-only references
        run: |
          git fetch --no-tags --depth=1 origin 89bff4ddfaad77da028deb1c927058711a83937c
          python3 .github/scripts/s047-source-rebind.py
          node .github/scripts/s047-source-audit.mjs
      - name: Retain source-only validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s047-current-source-preflight
          path: |
            crates/glitchpad-android-source/android/build/test-results/testDebugUnitTest/**
            scripts/bounded-android-adb.mjs
            scripts/run-android-evidence.test.mjs
            scripts/validate-android-recovery-evidence.mjs
            scripts/test-android-recovery-evidence.mjs
            scripts/check-android-package.mjs
            scripts/check-android-package.test.mjs
            packaging/android/package-contract.json
            packaging/android/intent-map.json
            Cargo.toml
            Cargo.lock
            crates/glitchpad-android-source/Cargo.toml
            crates/glitchpad-android-source/src/models.rs
            crates/glitchpad-android-source/src/mobile.rs
            crates/glitchpad-host/src/lib.rs
            crates/glitchpad-host/src/android_range_response.rs
            crates/glitchpad-host/tests/performance_conformance.rs
            crates/glitchpad-android-source/android/src/main/java/com/shruggietech/glitchpad/source/AndroidSourcePlugin.kt
            crates/glitchpad-host/gen/android/app/src/androidTest/java/com/shruggietech/glitchpad/source/AndroidDeliveryInstrumentedTest.kt
            scripts/run-android-connected-tests.sh
            apps/glitchpad/src/components/TaskSurface.tsx
            apps/glitchpad/src/components/TaskSurface.test.tsx
            apps/glitchpad/src/domain/large-text-gateway.ts
            apps/glitchpad/src/domain/large-text-gateway.test.ts
            scripts/check-app-layout.mjs
            ${{ runner.temp }}/s047-source-preflight/**
            .codex-tmp/s047/r28-hosted-source-rebind.json
            .codex-tmp/s047/current-control-reference-audit.json
            specs/047-android-task-completion/contracts/control-ledger.json
          retention-days: 7

  exact-source-aggregate:
    if: inputs.stage == 'aggregate'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      S047_SOURCE: ${{ inputs.candidate_source }}
    steps:
      - name: Require an exact candidate source
        run: '[[ "$S047_SOURCE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_source }}
      - name: Record checked out candidate
        run: |
          test "$(git rev-parse HEAD)" = "$S047_SOURCE"
          mkdir -p "$RUNNER_TEMP/s047-aggregate"
          printf '%s\n' "$S047_SOURCE" > "$RUNNER_TEMP/s047-aggregate/source.txt"
      - name: Build repository qualification environment once
        run: |
          set -o pipefail
          docker build --target qualification -t glitchpad-s047-validation -f scripts/docker/validation.Dockerfile . 2>&1 | tee "$RUNNER_TEMP/s047-aggregate/image-build.log"
          docker image inspect glitchpad-s047-validation --format '{{.Id}}' > "$RUNNER_TEMP/s047-aggregate/image-id.txt"
      - name: Run complete exact-source aggregate
        run: |
          set +e
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace -e CI=true -e GLITCHPAD_BUILD_COMMIT="$S047_SOURCE" -e VITE_GLITCHPAD_BUILD_COMMIT="$S047_SOURCE" glitchpad-s047-validation bash -c 'pnpm install --frozen-lockfile && cargo xtask check' 2>&1 | tee "$RUNNER_TEMP/s047-aggregate/check.log"
          checked_exit=${PIPESTATUS[0]}
          printf '{"source_commit":"%s","aggregate_exit":%s,"scope":"exact_source_linux_container_not_installed_android"}\n' "$S047_SOURCE" "$checked_exit" > "$RUNNER_TEMP/s047-aggregate/result.json"
          exit "$checked_exit"
      - name: Run fresh production modern and Chromium69 matrices
        run: |
          set -o pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace -v "$RUNNER_TEMP/s047-aggregate:/evidence" -e CI=true -e GLITCHPAD_BUILD_COMMIT="$S047_SOURCE" -e VITE_GLITCHPAD_BUILD_COMMIT="$S047_SOURCE" glitchpad-s047-validation bash -c 'set -e; pnpm run build; node scripts/check-app-layout.mjs --receipt /evidence/modern.json --source-commit "$GLITCHPAD_BUILD_COMMIT"; mkdir -p /tmp/glitchpad-browser-compat/client; npm install --prefix /tmp/glitchpad-browser-compat/client --ignore-scripts --no-audit --no-fund puppeteer-core@1.9.0; curl -fsSLo /tmp/glitchpad-chromium69.zip https://storage.googleapis.com/chromium-browser-snapshots/Linux_x64/576753/chrome-linux.zip; sha256sum /tmp/glitchpad-chromium69.zip > /evidence/chromium69-archive.sha256; python3 -m zipfile -e /tmp/glitchpad-chromium69.zip /tmp/glitchpad-browser-compat/chromium/linux-576753; chmod +x /tmp/glitchpad-browser-compat/chromium/linux-576753/chrome-linux/chrome; node scripts/check-app-layout.mjs --legacy --receipt /evidence/chromium69.json --source-commit "$GLITCHPAD_BUILD_COMMIT"' 2>&1 | tee "$RUNNER_TEMP/s047-aggregate/browser.log"
      - name: Retain aggregate and browser receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s047-exact-source-aggregate
          path: ${{ runner.temp }}/s047-aggregate/**
          retention-days: 7

  converge-context:
    if: inputs.stage == 'converge_context'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPECIFY_FEATURE: 047-android-task-completion
      SPECIFY_FEATURE_DIRECTORY: ${{ github.workspace }}/specs/047-android-task-completion
    steps:
      - uses: actions/checkout@v7
      - name: Initialize formal convergence context once
        run: |
          pwsh -NoLogo -NoProfile -NonInteractive -File .specify/scripts/powershell/check-prerequisites.ps1 -Json -RequireTasks -IncludeTasks > "$RUNNER_TEMP/s047-converge-prerequisites.json"
          cat "$RUNNER_TEMP/s047-converge-prerequisites.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: s047-formal-convergence-context
          path: ${{ runner.temp }}/s047-converge-prerequisites.json
          if-no-files-found: error
          retention-days: 7

  frontend-source:
    if: inputs.stage == 'working_candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove disabled preferred-focus regression before correction
        run: |
          mkdir -p "$RUNNER_TEMP/s047-source-preflight"
          cp apps/glitchpad/src/components/TaskSurface.tsx "$RUNNER_TEMP/s047-fixed-task-focus.tsx"
          git fetch --no-tags --depth=1 origin 8eef5f589cab9a17c15ca1937fc0c65223cfabe0
          git show 8eef5f589cab9a17c15ca1937fc0c65223cfabe0:apps/glitchpad/src/components/TaskSurface.tsx > apps/glitchpad/src/components/TaskSurface.tsx
          set +e
          pnpm --filter @shruggietech/glitchpad exec vitest run --maxWorkers=2 src/components/TaskSurface.test.tsx -t 'keeps focus inside an open Add document menu' > "$RUNNER_TEMP/s047-source-preflight/disabled-focus-red.log" 2>&1
          red_exit=$?
          set -e
          cp "$RUNNER_TEMP/s047-fixed-task-focus.tsx" apps/glitchpad/src/components/TaskSurface.tsx
          test "$red_exit" -ne 0
          grep -F 'keeps focus inside an open Add document menu' "$RUNNER_TEMP/s047-source-preflight/disabled-focus-red.log"
          grep -F 'Expected element with focus' "$RUNNER_TEMP/s047-source-preflight/disabled-focus-red.log"
