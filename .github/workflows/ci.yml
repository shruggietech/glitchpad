name: ci

on:
  pull_request:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    name: Documentation and public surface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Mermaid browser
        run: pnpm exec puppeteer browsers install chrome-headless-shell

      - name: Install website browser
        run: pnpm --filter @shruggietech/glitchpad-site exec playwright install --with-deps chromium

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Verify the delivered brand canon
        run: |
          python -m pip install coloraide==8.12
          python brand/build/verify.py brand --out /tmp/glitchpad-brand-verification.md

      - name: Validate documentation
        run: cargo xtask docs

  shared:
    name: Shared native and frontend checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-shared

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Frontend checks
        run: pnpm run check:frontend

  platform:
    name: Desktop host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux host libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.os }}

      - name: Run desktop source adapter conformance
        run: cargo test -p glitchpad-host --test desktop_source_conformance --locked

      - name: Build desktop foundation host
        run: pnpm tauri build --debug

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-aarch64

      - name: Build validation APK
        run: |
          export NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          pnpm tauri android build --debug --apk --target aarch64 --ci --config '{"version":"0.0.1"}'

      - name: Upload validation APK
        uses: actions/upload-artifact@v7
        with:
          name: glitchpad-foundation-android-aarch64
          path: crates/glitchpad-host/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  android-instrumentation:
    name: Android provider lifecycle (API ${{ matrix.api-level }})
    # Android emulator installation repeatedly stalls without hardware acceleration
    # on Linux-hosted runners. The Intel macOS image provides accelerated x86_64
    # emulation for the required API 24 and API 36 lifecycle evidence.
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Rust Android emulator target
        run: rustup target add x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-x86_64-api-${{ matrix.api-level }}

      - name: Run controlled-provider and restoration evidence
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: |
            export NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
            pnpm tauri android build --debug --apk --target x86_64 --ci --config '{"version":"0.0.1"}'
            ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :glitchpad-android-source:testDebugUnitTest --no-daemon
            ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :app:connectedUniversalDebugAndroidTest -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 -x :app:rustBuildUniversalDebug -x :app:rustBuildX86_64Debug --no-daemon
            adb shell am instrument -w -e class com.shruggietech.glitchpad.source.RestorationInstrumentedTest#privateRestorationRecordSurvivesProcessBoundary -e restorationPhase seed com.shruggietech.glitchpad.test/androidx.test.runner.AndroidJUnitRunner
            adb shell am force-stop com.shruggietech.glitchpad
            adb shell am instrument -w -e class com.shruggietech.glitchpad.source.RestorationInstrumentedTest#privateRestorationRecordSurvivesProcessBoundary -e restorationPhase verify com.shruggietech.glitchpad.test/androidx.test.runner.AndroidJUnitRunner

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-provider-lifecycle-api-${{ matrix.api-level }}
          path: |
            crates/glitchpad-host/gen/android/app/build/reports/androidTests/**
            crates/glitchpad-host/gen/android/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  security:
    name: Licenses, advisories, and secret patterns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Scan for committed secrets
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: detect --source . --verbose --redact --no-banner

  labeler:
    name: Pull request labels
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply path labels
        uses: actions/labeler@v7

  ci-ok:
    name: ci-ok
    needs:
      [
        docs,
        shared,
        platform,
        android,
        android-instrumentation,
        dependency-review,
        security,
        labeler,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          DOCS_RESULT: ${{ needs.docs.result }}
          SHARED_RESULT: ${{ needs.shared.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_INSTRUMENTATION_RESULT: ${{ needs.android-instrumentation.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          LABELER_RESULT: ${{ needs.labeler.result }}
        run: |
          results="$DOCS_RESULT $SHARED_RESULT $PLATFORM_RESULT $ANDROID_RESULT $ANDROID_INSTRUMENTATION_RESULT $DEPENDENCY_RESULT $SECURITY_RESULT $LABELER_RESULT"
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A required CI job failed or was cancelled ($results)"
              exit 1
            fi
          done
