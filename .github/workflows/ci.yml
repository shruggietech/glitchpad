name: ci

on:
  pull_request:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      android_runtime:
        description: Android runtime scope (diagnostics do not qualify a candidate)
        type: choice
        default: full
        options: [full, source_only, back_diagnostic]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    name: Documentation and public surface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Mermaid browser
        run: pnpm exec puppeteer browsers install chrome-headless-shell

      - name: Install website browser
        run: pnpm --filter @shruggietech/glitchpad-site exec playwright install --with-deps chromium

      - name: Verify the delivered brand canon
        run: pnpm check:brand

      - name: Setup Python for the bundled BrandBuilder verifier
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify the exact bundled BrandBuilder recovery contract
        run: |
          python -m pip install --disable-pip-version-check coloraide==8.12.1 pillow==12.3.0 fonttools==4.65.0 brotli==1.2.0 pikepdf==10.13.0.post1 svgelements==1.9.6
          python scripts/verify-brandbuilder.py

      - name: Validate documentation
        run: cargo xtask docs

      - name: Retain composed task geometry receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: composed-task-geometry
          path: |
            artifacts/android-task-layout/**
            artifacts/android-authoring-layout/**
            artifacts/image-layout/result.json
            artifacts/image-layout/failed.json
            artifacts/image-layout/failed.png
          if-no-files-found: warn
          retention-days: 7

  shared:
    name: Shared native and frontend checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-shared

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Audit JavaScript dependency advisories
        run: pnpm run check:advisories

      - name: Frontend checks
        run: pnpm run check:frontend

  performance:
    name: Performance policy and hosted smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install governed performance browser
        run: pnpm exec puppeteer browsers install chrome-headless-shell

      - name: Validate policy and run representative smoke
        run: |
          pnpm run check:performance
          pnpm run check:shell-layout
          node scripts/run-performance.mjs --profile hosted_windows_smoke_v1 --build-id "pr-${{ github.event.pull_request.head.sha || github.sha }}" --confirm-hard-failure

  platform:
    name: Desktop host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux host libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.os }}

      - name: Markdown recovery and shared shell smoke
        run: pnpm --filter @shruggietech/glitchpad exec vitest run --maxWorkers=2 src/App.test.tsx src/components/ApplicationMenu.test.tsx src/components/DocumentSurface.test.tsx src/components/MarkdownSurface.test.tsx src/components/ImageSurface.test.tsx src/components/ImageMetadataInspector.test.tsx src/domain/image-metadata.test.ts

      - name: Image family corpus and privacy
        run: cargo test -p glitchpad-core --locked --test image_contract --test image_decode --test image_metadata --test image_family --test image_family_decode

      - name: Measure native image qualification
        env:
          GLITCHPAD_SOURCE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/image-qualification
          cargo run -p glitchpad-core --example image_qualification --locked > artifacts/image-qualification/native-${{ matrix.os }}.json

      - name: Retain native image measurements
        uses: actions/upload-artifact@v6
        with:
          name: image-qualification-${{ matrix.os }}
          path: artifacts/image-qualification/
          if-no-files-found: error

      - name: Verify persistent Linux D-Bus plugin runtime
        if: matrix.os == 'ubuntu-latest'
        run: dbus-run-session -- cargo test -p tauri-plugin-single-instance --lib s043_tests --locked

      - name: Run desktop source adapter conformance
        run: cargo test -p glitchpad-host --test desktop_source_conformance --locked

      - name: Build desktop foundation host
        run: pnpm tauri build --debug

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-aarch64

      - name: Build validation APK
        run: |
          export NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          pnpm tauri android build --debug --apk --target aarch64 --ci

      - name: Upload validation APK
        uses: actions/upload-artifact@v7
        with:
          name: glitchpad-foundation-android-aarch64
          path: crates/glitchpad-host/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  android-instrumentation:
    if: github.event_name != 'workflow_dispatch' || inputs.android_runtime != 'source_only'
    env:
      ANDROID_S047_BACK_DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.android_runtime == 'back_diagnostic' && 'true' || 'false' }}
      GLITCHPAD_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      VITE_GLITCHPAD_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.android_runtime == 'back_diagnostic' && 'Android Back diagnostic' || 'Android task journeys' }} (${{ matrix.role }}, API ${{ matrix.api-level }})
    # Explicit KVM access keeps the guest Android versions and test budgets unchanged.
    # Focused API 24/API 36 diagnostics completed on this accelerated Linux host.
    runs-on: ubuntu-latest
    # Retain the full composed campaign after the observed build/emulator setup cost.
    # Per-action and per-process attempt limits remain enforced by their runners.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.android_runtime == 'back_diagnostic' && '{"api-level":[36],"role":["ordinary"]}' || '{"api-level":[24,36],"role":["ordinary","fault_probe"]}') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Verify hosted offline controller before the APK build
        if: matrix.api-level == 24 && matrix.role == 'ordinary'
        run: node --test scripts/android-offline-mode.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Rust Android emulator target
        run: rustup target add x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-x86_64-api-${{ matrix.api-level }}
          cache-on-failure: true

      - name: Build emulator APK and provider unit tests
        env:
          VITE_GLITCHPAD_RECOVERY_PROBES: ${{ matrix.role == 'fault_probe' && '1' || '0' }}
        run: |
          export NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          pnpm tauri android build --debug --apk --target x86_64 --ci
          node scripts/check-android-build-role.mjs "${{ matrix.role }}"
          node --test scripts/configure-android-task-avd.test.mjs
          ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :glitchpad-android-source:testDebugUnitTest --no-daemon
          ./crates/glitchpad-host/gen/android/gradlew --project-dir crates/glitchpad-host/gen/android :app:assembleUniversalDebugAndroidTest -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 -x :app:rustBuildUniversalDebug -x :app:rustBuildX86_64Debug --no-daemon

      - name: Enable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run provider, resolver, delivery, and restoration evidence
        env:
          GLITCHPAD_RECOVERY_PROBE_VARIANT: ${{ matrix.role == 'fault_probe' && 'compiled_test_only' || 'none' }}
          GLITCHPAD_CANDIDATE_ROLE: ${{ matrix.role }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          # Keep API 24's older Chrome coverage. API 36 uses the official AOSP image
          # to exercise offline framework behavior without Google first-boot work.
          target: ${{ matrix.api-level == 36 && 'default' || 'google_apis' }}
          cores: 4
          emulator-boot-timeout: 900
          disable-animations: true
          # The deprecated indirect renderer crashed during WebView teardown on both
          # governed API levels. Use Android's supported software renderer and keep
          # Vulkan disabled for this headless GLES test workload.
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan
          # Set hardware before boot; emulator-generated properties override -prop.
          pre-emulator-launch-script: node scripts/configure-android-task-avd.mjs "$ANDROID_AVD_HOME/test.avd/config.ini"
          script: |
            # These offline tests do not need Google services. Avoid their first-boot
            # work starving instrumentation on the disposable hosted emulator.
            set -e; for package in com.google.android.gms com.google.android.googlequicksearchbox; do if adb shell pm list packages "$package" | grep -Fq "package:$package"; then adb shell pm disable-user --user 0 "$package"; fi; done
            # The API 36 system Bluetooth service can crash and leave its error dialog above
            # the AppFrame activity, stealing input focus from the WebView under test.
            node scripts/capture-android-navigation.mjs "$RUNNER_TEMP/s047-navigation-environment.json"
            adb shell svc power stayon true
            adb shell input keyevent 224
            if [ "${{ matrix.api-level }}" = "36" ]; then adb shell svc bluetooth disable; fi
            # Follow AOSP CTS input-test setup: suppress later system crash/ANR dialogs and
            # close any dialog already present before testing the foreground WebView.
            if [ "${{ matrix.api-level }}" = "36" ]; then adb shell settings put global hide_error_dialogs 1 && adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS; fi
            bash scripts/run-android-connected-tests.sh
            apkanalyzer manifest print "$RUNNER_TEMP/android-tested-candidate/application.apk" > "$RUNNER_TEMP/s047-application-manifest.xml"
            grep -Eq 'android:enableOnBackInvokedCallback="true"' "$RUNNER_TEMP/s047-application-manifest.xml"
            adb install -r "$RUNNER_TEMP/android-tested-candidate/application.apk"
            adb install -r "$RUNNER_TEMP/android-tested-candidate/instrumentation.apk"
            adb shell settings put secure show_ime_with_hard_keyboard 1
            if [ "${{ matrix.api-level }}" = "36" ]; then adb shell cmd overlay list | grep -F 'com.android.internal.display.cutout.emulation.corner' && adb shell cmd overlay enable --user 0 com.android.internal.display.cutout.emulation.corner && adb shell cmd overlay list | grep -F '[x] com.android.internal.display.cutout.emulation.corner'; fi
            # Exercise API 36 AppFrame on a fresh emulator, before long provider suites.
            if [ "${{ matrix.api-level }}" = "36" ]; then adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS && adb shell input keyevent KEYCODE_WAKEUP && adb shell wm dismiss-keyguard; fi
            if [ "${{ matrix.api-level }}" = "36" ]; then ime_id='com.shruggietech.glitchpad.test/com.shruggietech.glitchpad.shell.FixtureInputMethodService'; for attempt in $(seq 1 30); do if adb shell ime list -s -a | grep -Fq "$ime_id"; then break; fi; sleep 1; done; adb shell ime list -s -a | grep -Fq "$ime_id" && adb shell ime enable "$ime_id" && adb shell ime set "$ime_id" && adb shell settings get secure default_input_method | grep -Fqx "$ime_id"; fi
            if [ "${{ matrix.api-level }}" = "36" ]; then ANDROID_INSTRUMENTATION_PRESERVE_TEST_INPUT_METHOD=true bash scripts/run-android-instrumentation.sh "$RUNNER_TEMP/appframe-evidence.txt" 'appframe_evidence=' -e waitForActivitiesToComplete false -e class com.shruggietech.glitchpad.shell.BrandBuilderAppFrameInstrumentedTest; fi
            if [ "${{ matrix.api-level }}" = "36" ]; then adb shell ime reset; fi
            bash scripts/run-android-s047-journeys.sh "${{ matrix.api-level }}" "$GLITCHPAD_BUILD_COMMIT" "${{ matrix.role }}"
            if [ "$ANDROID_S047_BACK_DIAGNOSTIC" != true ]; then bash scripts/run-android-instrumentation.sh "$RUNNER_TEMP/restoration-seed.txt" 'OK (1 test)' -e class com.shruggietech.glitchpad.source.RestorationInstrumentedTest#privateRestorationRecordSurvivesProcessBoundary -e restorationPhase seed; fi
            if [ "$ANDROID_S047_BACK_DIAGNOSTIC" != true ]; then bash scripts/run-android-instrumentation.sh "$RUNNER_TEMP/restoration-verify.txt" 'OK (1 test)' -e class com.shruggietech.glitchpad.source.RestorationInstrumentedTest#privateRestorationRecordSurvivesProcessBoundary -e restorationPhase verify; fi
            if [ "$ANDROID_S047_BACK_DIAGNOSTIC" != true ]; then bash scripts/run-android-instrumentation.sh "$RUNNER_TEMP/performance-evidence.txt" 'performance_evidence=' -e waitForActivitiesToComplete false -e class com.shruggietech.glitchpad.performance.PerformanceInstrumentedTest; fi
            if [ "$ANDROID_S047_BACK_DIAGNOSTIC" != true ]; then node scripts/check-performance.mjs --android-instrumentation-output "$RUNNER_TEMP/performance-evidence.txt" --api-level "${{ matrix.api-level }}"; fi
            if [ "${{ matrix.api-level }}" != "36" ]; then adb shell ime enable 'com.shruggietech.glitchpad.test/com.shruggietech.glitchpad.shell.FixtureInputMethodService' && adb shell ime set 'com.shruggietech.glitchpad.test/com.shruggietech.glitchpad.shell.FixtureInputMethodService' && adb shell settings get secure default_input_method | grep -Fqx 'com.shruggietech.glitchpad.test/com.shruggietech.glitchpad.shell.FixtureInputMethodService'; fi
            if [ "${{ matrix.api-level }}" != "36" ]; then ANDROID_INSTRUMENTATION_PRESERVE_TEST_INPUT_METHOD=true bash scripts/run-android-instrumentation.sh "$RUNNER_TEMP/appframe-evidence.txt" 'appframe_evidence=' -e waitForActivitiesToComplete false -e class com.shruggietech.glitchpad.shell.BrandBuilderAppFrameInstrumentedTest; fi

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.android_runtime == 'back_diagnostic' && 'android-back-diagnostic' || 'android-task-journeys' }}-${{ matrix.role }}-api-${{ matrix.api-level }}
          path: |
            crates/glitchpad-host/gen/android/app/build/reports/androidTests/**
            crates/glitchpad-host/gen/android/app/build/outputs/androidTest-results/**
            ${{ runner.temp }}/*.txt
            ${{ runner.temp }}/*.png
            ${{ runner.temp }}/*.json
            ${{ runner.temp }}/*.xml
            ${{ runner.temp }}/android-tested-candidate/**
          if-no-files-found: warn
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  security:
    name: Licenses, advisories, and secret patterns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Scan for committed secrets
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: detect --source . --verbose --redact --no-banner

  labeler:
    name: Pull request labels
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply path labels
        uses: actions/labeler@v7

  ci-ok:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.android_runtime != 'full' && format('{0}-ci', inputs.android_runtime) || 'ci-ok' }}
    needs:
      [
        docs,
        shared,
        performance,
        image-fuzz,
        platform,
        android,
        android-instrumentation,
        dependency-review,
        security,
        labeler,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          DOCS_RESULT: ${{ needs.docs.result }}
          SHARED_RESULT: ${{ needs.shared.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          IMAGE_FUZZ_RESULT: ${{ needs.image-fuzz.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_INSTRUMENTATION_RESULT: ${{ needs.android-instrumentation.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          LABELER_RESULT: ${{ needs.labeler.result }}
        run: |
          results="$DOCS_RESULT $SHARED_RESULT $PERFORMANCE_RESULT $IMAGE_FUZZ_RESULT $PLATFORM_RESULT $ANDROID_RESULT $ANDROID_INSTRUMENTATION_RESULT $DEPENDENCY_RESULT $SECURITY_RESULT $LABELER_RESULT"
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A required CI job failed or was cancelled ($results)"
              exit 1
            fi
          done

  image-fuzz:
    name: Bounded image fuzz qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned fuzz tooling
        run: |
          rustup toolchain install nightly-2026-10-31 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Verify valid seeds reach pixel decoding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/s043-fuzz
          cargo test --manifest-path fuzz/Cargo.toml --lib --locked 2>&1 | tee .tmp/s043-fuzz/seed-check.log
      - name: Run bounded original-corpus campaign
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/s043-fuzz/corpus
          cp fixtures/images/original.* fixtures/images/animated.webp fixtures/images/entries.ico fixtures/images/hostile.svg .tmp/s043-fuzz/corpus/
          cargo +nightly-2026-10-31 fuzz run image_boundaries .tmp/s043-fuzz/corpus -- -max_total_time=60 -timeout=10 -rss_limit_mb=1536 -max_len=65536 -seed=43 -artifact_prefix=.tmp/s043-fuzz/ 2>&1 | tee .tmp/s043-fuzz/campaign.log
      - name: Retain fuzz campaign and findings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: image-fuzz-qualification
          path: .tmp/s043-fuzz/
          if-no-files-found: error
