  playback-fixture-preflight:
    if: inputs.stage == 'fixture_preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-ubuntu-latest
          cache-on-failure: true
      - name: Retain the proposed original and looping fixture identities
        run: cp fixtures/images/manifest.json "$RUNNER_TEMP/s047-expected-fixture-manifest.json"
      - name: Format and regenerate the project-owned image corpus
        run: |
          cargo fmt --all
          cargo run --locked -p glitchpad-core --example generate_image_fixtures 2>&1 | tee "$RUNNER_TEMP/s047-fixture-generator.log"
      - name: Independently verify every old fixture and the new loop metadata
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          expected=json.loads((Path(os.environ['RUNNER_TEMP'])/'s047-expected-fixture-manifest.json').read_text())
          actual=json.loads(Path('fixtures/images/manifest.json').read_text())
          assert actual==expected, 'Regeneration changed the proposed manifest or an existing fixture identity'
          observed=[]
          for item in expected['files']:
            data=(Path('fixtures/images')/item['name']).read_bytes()
            assert len(data)==item['bytes']
            assert hashlib.sha256(data).hexdigest()==item['sha256'],item['name']
            observed.append({'name':item['name'],'bytes':len(data),'sha256':item['sha256']})
          original=Path('fixtures/images/original.gif').read_bytes()
          playback=Path('fixtures/images/s047-playback.gif').read_bytes()
          marker=b'NETSCAPE2.0'
          a=original.index(marker); b=playback.index(marker)
          assert int.from_bytes(original[a+13:a+15],'little')==2
          assert int.from_bytes(playback[b+13:b+15],'little')==0
          assert [i for i,(x,y) in enumerate(zip(original,playback)) if x!=y]==[a+13]
          (Path(os.environ['RUNNER_TEMP'])/'s047-fixture-readback.json').write_text(json.dumps({'all_fixtures':observed,'original_repeat_count':2,'playback_repeat_count':0,'original_bytes_unchanged':True},indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify core image and finite-animation behavior
        run: cargo test --locked -p glitchpad-core --tests 2>&1 | tee "$RUNNER_TEMP/s047-fixture-core-tests.log"
      - name: Retain fixture generation proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: s047-looping-fixture-preflight
          path: |
            crates/glitchpad-core/examples/generate_image_fixtures.rs
            fixtures/images/s047-playback.gif
            fixtures/images/manifest.json
            ${{ runner.temp }}/s047-fixture-*.json
            ${{ runner.temp }}/s047-fixture-*.log
          retention-days: 7


