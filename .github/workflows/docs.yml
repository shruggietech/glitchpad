name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy:
        description: Deploy the already-published release site
        required: false
        type: boolean
        default: false
      release_tag:
        description: Exact published release tag
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @shruggietech/glitchpad-site exec playwright install --with-deps chromium

      - name: Verify brand integration
        run: pnpm check:brand

      - name: Build and test public site
        run: pnpm check:site
        env:
          GLITCHPAD_SOURCE_REVISION: ${{ github.sha }}

      - name: Verify generated documentation contracts are committed
        run: git diff --exit-code -- site/content/docs/index.mdx site/content/docs/meta.json site/lib/generated/documentation.json

      - name: Upload Pages artifact
        if: inputs.deploy && inputs.release_tag == 'v0.1.2'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: inputs.deploy && inputs.release_tag == 'v0.1.2'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v7

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify production deployment
        run: node scripts/verify-site-deployment.mjs
        env:
          GLITCHPAD_EXPECTED_VERSION: 0.1.2
          GLITCHPAD_EXPECTED_REVISION: ${{ github.sha }}
