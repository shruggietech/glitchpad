name: linux-package

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      stage_release:
        description: Prepare unpublished accepted release inputs (no publication)
        type: boolean
        default: false

concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: true

env:
  GLITCHPAD_BUILD_COMMIT: ${{ github.sha }}
  VITE_GLITCHPAD_BUILD_COMMIT: ${{ github.sha }}

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  candidate:
    name: Ubuntu 22.04 x86_64 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate preparation authority
        shell: bash
        env:
          STAGE_RELEASE: ${{ inputs.stage_release || false }}
        run: |
          test "$GITHUB_REF_TYPE" = branch
          if [ "$STAGE_RELEASE" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REPOSITORY" = shruggietech/glitchpad
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build governed Ubuntu 22.04 environment
        run: docker build --target linux-package --tag glitchpad-linux-package:local --file scripts/docker/validation.Dockerfile .

      - name: Prepare job-local Cargo inputs
        run: mkdir -p "$RUNNER_TEMP/glitchpad-cargo/registry" "$RUNNER_TEMP/glitchpad-cargo/git"

      - name: Validate source and package contracts
        run: |
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            --volume "$RUNNER_TEMP/glitchpad-cargo/registry:/usr/local/cargo/registry" \
            --volume "$RUNNER_TEMP/glitchpad-cargo/git:/usr/local/cargo/git" glitchpad-linux-package:local sh -lc '
            set -eu
            cargo fetch --locked
            pnpm install --frozen-lockfile
            pnpm run check:linux-package
            cargo test -p glitchpad-host --locked
            pnpm test
          '

      - name: Prove locked metadata is independent of network
        run: |
          docker run --rm --network none --volume "$PWD:/workspace" --workdir /workspace \
            --volume "$RUNNER_TEMP/glitchpad-cargo/registry:/usr/local/cargo/registry" \
            --volume "$RUNNER_TEMP/glitchpad-cargo/git:/usr/local/cargo/git" \
            glitchpad-linux-package:local sh -lc '
              set -eu
              lock_before="$(sha256sum Cargo.lock)"
              proof_root="$(mktemp -d)"
              trap "rm -rf \"$proof_root\"" EXIT
              cargo metadata --locked --offline --format-version 1 > "$proof_root/metadata.json"
              jq -e ".packages | length > 1" "$proof_root/metadata.json" >/dev/null
              jq -e ".resolve.nodes | length > 1" "$proof_root/metadata.json" >/dev/null
              if CARGO_HOME="$proof_root/empty-cache" cargo metadata --locked --offline --format-version 1 > "$proof_root/empty.json" 2> "$proof_root/empty-error.log"; then
                echo "::error::Offline metadata unexpectedly accepted an empty cache."
                exit 1
              fi
              test "$lock_before" = "$(sha256sum Cargo.lock)"
            '

      - name: Build governed AppImage and Debian candidates
        run: |
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            --env GLITCHPAD_BUILD_COMMIT --env VITE_GLITCHPAD_BUILD_COMMIT --env GITHUB_SHA \
            --volume "$RUNNER_TEMP/glitchpad-cargo/registry:/usr/local/cargo/registry" \
            --volume "$RUNNER_TEMP/glitchpad-cargo/git:/usr/local/cargo/git" glitchpad-linux-package:local sh -lc '
            set -eu
            pnpm tauri build --verbose --bundles appimage,deb --config tauri.s021-linux.conf.json
          '

      - name: Assemble final-byte candidate and evidence
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_IDENTITY: ${{ github.workflow_ref }}
        run: |
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            --volume "$RUNNER_TEMP/glitchpad-cargo/registry:/usr/local/cargo/registry" \
            --volume "$RUNNER_TEMP/glitchpad-cargo/git:/usr/local/cargo/git" \
            --env SOURCE_COMMIT --env WORKFLOW_IDENTITY \
            glitchpad-linux-package:local sh -lc '
              set -eu
              upstream_appimage="$(find target/release/bundle/appimage -maxdepth 1 -name "*.AppImage" -print -quit)"
              appdir="$(find target/release/bundle/appimage -maxdepth 1 -name "*.AppDir" -type d -print -quit)"
              deb_path="$(find target/release/bundle/deb -maxdepth 1 -name "*.deb" -print -quit)"
              test -n "$upstream_appimage"
              test -n "$appdir"
              test -n "$deb_path"
              work_root="$(mktemp -d)"
              trap "rm -rf \"$work_root\"" EXIT
              appimage_path="$work_root/candidate.AppImage"
              node scripts/linux/thin-appimage.mjs --input "$upstream_appimage" --appdir "$appdir" --output "$appimage_path"
              (cd "$work_root" && ./candidate.AppImage --appimage-extract >/dev/null)
              find "$work_root/squashfs-root" -printf "%P\n" | sed "/^$/d" | sort | jq -R -s "split(\"\\n\")[:-1] | map({path:.})" > "$work_root/appimage-inventory.json"
              dpkg-deb --contents "$deb_path" | awk "{path=\$6; sub(/^\\.\\//,\"\",path); sub(/\\/$/,\"\",path); if (length(path)) print path}" | sort | jq -R -s "split(\"\\n\")[:-1] | map({path:.})" > "$work_root/deb-inventory.json"
              node scripts/linux/collect-build-baseline.mjs \
                --executable target/release/glitchpad-host \
                --output "$work_root/build-baseline.json"
              rm -rf artifacts/linux
              node scripts/linux/assemble-package.mjs \
                --appimage "$appimage_path" --deb "$deb_path" --output artifacts/linux \
                --source-commit "$SOURCE_COMMIT" --workflow-identity "$WORKFLOW_IDENTITY" \
                --baseline "$work_root/build-baseline.json" \
                --appimage-inventory "$work_root/appimage-inventory.json" \
                --deb-inventory "$work_root/deb-inventory.json"
              cargo metadata --locked --offline --format-version 1 > artifacts/linux/cargo-metadata.json
              pnpm list --prod --recursive --json --depth Infinity > artifacts/linux/pnpm-list.json
              node scripts/generate-linux-sbom.mjs artifacts/linux/cargo-metadata.json artifacts/linux/pnpm-list.json artifacts/linux/glitchpad-linux.cdx.json "$SOURCE_COMMIT"
              node scripts/check-linux-package.mjs --evidence artifacts/linux/linux-package-manifest.json --artifact-root artifacts/linux
            '

      - name: Restore runner ownership of Linux evidence
        run: sudo chown --recursive "$(id --user):$(id --group)" artifacts/linux

      - name: Upload governed Linux package
        if: ${{ !inputs.stage_release }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.stage_release && 'glitchpad-0.3.0-linux-x86_64-community-release' || 'glitchpad-0.3.0-linux-x86_64-non-official-candidate' }}
          path: artifacts/linux/**
          if-no-files-found: error
          retention-days: 30

      - name: Promote truthful community evidence
        if: inputs.stage_release
        run: node scripts/promote-community-package.mjs --platform linux --directory artifacts/linux --source-commit '${{ github.sha }}'

      - name: Attest final Linux community artifacts
        if: inputs.stage_release
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/linux/glitchpad-0.3.0-linux-x86_64.AppImage
            artifacts/linux/glitchpad-0.3.0-linux-x86_64.deb

      - name: Preserve repository attestation evidence
        if: inputs.stage_release
        run: cp '${{ steps.attest.outputs.bundle-path }}' artifacts/linux/repository-attestation.json

      - name: Upload governed Linux community package
        if: inputs.stage_release
        uses: actions/upload-artifact@v7
        with:
          name: glitchpad-0.3.0-linux-x86_64-community-release
          path: artifacts/linux/**
          if-no-files-found: error
          retention-days: 30

  clean-environment:
    name: Clean Ubuntu ${{ matrix.release }} ${{ matrix.package_form }} lifecycle
    needs: candidate
    runs-on: ubuntu-24.04
    # Clean image construction has crossed 30 minutes on otherwise healthy hosted
    # runners. Keep a bounded ceiling while leaving time for lifecycle validation.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '22.04'
            container_target: linux-package
            package_form: appimage
            artifact_name: glitchpad-0.3.0-linux-x86_64.AppImage
          - release: '22.04'
            container_target: linux-package
            package_form: deb
            artifact_name: glitchpad-0.3.0-linux-x86_64.deb
          - release: '24.04'
            container_target: linux-lifecycle-24
            package_form: appimage
            artifact_name: glitchpad-0.3.0-linux-x86_64.AppImage
          - release: '24.04'
            container_target: linux-lifecycle-24
            package_form: deb
            artifact_name: glitchpad-0.3.0-linux-x86_64.deb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.stage_release && 'glitchpad-0.3.0-linux-x86_64-community-release' || 'glitchpad-0.3.0-linux-x86_64-non-official-candidate' }}
          path: artifacts/linux

      - name: Build clean lifecycle environment
        run: docker build --target '${{ matrix.container_target }}' --tag glitchpad-linux-lifecycle:local --file scripts/docker/validation.Dockerfile .

      - name: Exercise install, launch, delivery, and removal
        run: |
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            --volume "$RUNNER_TEMP/glitchpad-cargo/registry:/usr/local/cargo/registry" \
            --volume "$RUNNER_TEMP/glitchpad-cargo/git:/usr/local/cargo/git" glitchpad-linux-lifecycle:local \
            timeout --signal=KILL 120s xvfb-run -a dbus-run-session -- node scripts/linux/test-package-lifecycle.mjs \
              --package 'artifacts/linux/${{ matrix.artifact_name }}' \
              --manifest artifacts/linux/linux-package-manifest.json \
              --receipt 'clean-ubuntu-${{ matrix.release }}-${{ matrix.package_form }}.json' \
              --package-form '${{ matrix.package_form }}' \
              --release '${{ matrix.release }}' \
              ${{ inputs.stage_release && '--official' || '' }}

      - name: Upload content-free clean-environment receipt
        uses: actions/upload-artifact@v7
        with:
          name: glitchpad-linux-clean-ubuntu-${{ matrix.release }}-${{ matrix.package_form }}
          path: clean-ubuntu-${{ matrix.release }}-${{ matrix.package_form }}.json
          if-no-files-found: error
          retention-days: 30
