name: release-readiness

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  readiness:
    name: Version, documentation, and publication readiness
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source and documentation
        run: cargo xtask check

      - name: Verify release state
        shell: pwsh
        run: ./scripts/check-release-readiness.ps1 -Tag '${{ github.ref_name }}'

      - name: Publication remains separately authorized
        run: Write-Host 'Readiness passed. Publication remains separately authorized.'

      - name: Enforce the Windows signing authority contract
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE -or -not $env:WINDOWS_SIGNING_PASSWORD) {
            throw 'Official Windows artifacts require provisioned signing authority. Unsigned candidates cannot be promoted.'
          }
          Write-Host 'Signing authority is provisioned. A separately reviewed publication workflow must bind signatures and attestations to final bytes.'

  macos-authority:
    name: Enforce the macOS signing and notarization authority contract
    if: startsWith(github.ref, 'refs/tags/')
    needs: readiness
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
      MACOS_REQUIRED_EVIDENCE: SHA256SUMS,macos-package-manifest.json,glitchpad-macos.cdx.json,provenance.json,clean-host-arm64.json,clean-host-x86_64.json,apple-trust-evidence.json,notarization-log.json
    steps:
      - name: Verify macOS publication authority is provisioned
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_PATH"
          test -n "$MACOS_REQUIRED_EVIDENCE"
          echo 'macOS authority is provisioned. Publication remains separately authorized.'
