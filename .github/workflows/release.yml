name: release

on:
  push:
    tags:
      - 'v0.1.2'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  attestations: read

concurrency:
  group: release-v0.1.2
  cancel-in-progress: false

jobs:
  readiness:
    name: Validate release preparation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:community-release
      - name: Confirm stable Android release authority
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          required=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_SIGNING_CERT_SHA256)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing release authority::$name is not configured."
              exit 1
            fi
          done
      - name: Confirm manual readiness source
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error title=Invalid readiness source::Manual release readiness must run from current main.'
            exit 1
          fi
      - name: Verify exact publication context
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/check-release-readiness.ps1 -Tag '${{ github.ref_name }}' -Repository '${{ github.repository }}'
      - name: Confirm non-publishing manual validation
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Readiness and release authority checks passed. Manual dispatch cannot publish.'

  locate-platform-runs:
    name: Wait for tag package workflows
    if: startsWith(github.ref, 'refs/tags/')
    needs: readiness
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.locate.outputs.windows }}
      macos: ${{ steps.locate.outputs.macos }}
      linux: ${{ steps.locate.outputs.linux }}
      android: ${{ steps.locate.outputs.android }}
    steps:
      - name: Locate successful package runs for this commit
        id: locate
        uses: actions/github-script@v8
        with:
          script: |
            const workflows = { windows: 'windows-package.yml', macos: 'macos-package.yml', linux: 'linux-package.yml', android: 'android-package.yml' };
            const deadline = Date.now() + 90 * 60 * 1000;
            for (const [platform, workflow_id] of Object.entries(workflows)) {
              let run;
              while (Date.now() < deadline) {
                const response = await github.rest.actions.listWorkflowRuns({ owner: context.repo.owner, repo: context.repo.repo, workflow_id, event: 'push', per_page: 20 });
                run = response.data.workflow_runs.find((candidate) => candidate.head_sha === context.sha && candidate.head_branch === context.ref.replace('refs/tags/', ''));
                if (run?.conclusion === 'success') break;
                if (run?.status === 'completed') throw new Error(`${platform} package workflow concluded ${run.conclusion}`);
                await new Promise((resolve) => setTimeout(resolve, 30000));
              }
              if (!run || run.conclusion !== 'success') throw new Error(`${platform} package workflow did not succeed before timeout`);
              core.setOutput(platform, String(run.id));
            }

  publish:
    name: Publish immutable GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: locate-platform-runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: glitchpad-0.1.2-windows-x86_64-community-release
          path: gathered/windows
          run-id: ${{ needs.locate-platform-runs.outputs.windows }}
          github-token: ${{ github.token }}
      - name: Download glitchpad-0.1.2-macos-universal-community-release and receipts
        uses: actions/download-artifact@v8
        with:
          pattern: glitchpad-*
          merge-multiple: true
          path: gathered/macos
          run-id: ${{ needs.locate-platform-runs.outputs.macos }}
          github-token: ${{ github.token }}
      - name: Download glitchpad-0.1.2-linux-x86_64-community-release and receipts
        uses: actions/download-artifact@v8
        with:
          pattern: glitchpad-*
          merge-multiple: true
          path: gathered/linux
          run-id: ${{ needs.locate-platform-runs.outputs.linux }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: glitchpad-0.1.2-android-community-release
          path: gathered/android
          run-id: ${{ needs.locate-platform-runs.outputs.android }}
          github-token: ${{ github.token }}
      - name: Preserve platform evidence bundles
        run: |
          mkdir -p release-assets
          for platform in windows macos linux android; do
            tar -czf "release-assets/glitchpad-0.1.2-${platform}-evidence.tar.gz" -C "gathered/$platform" .
          done
      - run: node scripts/assemble-community-release.mjs --input gathered --output release-assets --source-commit '${{ github.sha }}'
      - name: Refuse replacement and publish once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view '${{ github.ref_name }}' >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published bytes.' >&2
            exit 1
          fi
          gh release create '${{ github.ref_name }}' release-assets/* --verify-tag --title 'Glitchpad v0.1.2' --notes-file docs/releases/v0.1.2.md

  publish-site:
    name: Publish v0.1.2 site
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      deploy: true
      release_tag: v0.1.2
