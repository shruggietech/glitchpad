name: windows-package

on:
  pull_request:
  push:
    branches:
      - 'codex/**'
    tags:
      - 'v0.1.3'
  workflow_dispatch:

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    name: Windows 11 x86_64 candidate
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-package

      - name: Validate package policy and assembly contracts
        shell: pwsh
        run: |
          pnpm run check:windows-package
          pnpm --filter @shruggietech/glitchpad exec vitest run src/components/DocumentSurface.test.tsx src/components/MarkdownSurface.test.tsx
          ./scripts/windows/test-assemble-package.ps1

      - name: Build governed NSIS candidate
        run: pnpm tauri build --bundles nsis --config tauri.s019-windows.conf.json

      - name: Assemble final-byte candidate and evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $installer = Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'The governed NSIS installer was not produced.' }
          ./scripts/windows/assemble-package.ps1 -Version '0.1.3' -Executable 'target/release/glitchpad-host.exe' -Installer $installer.FullName -OutputRoot 'artifacts/windows' -SourceCommit '${{ github.sha }}' -WorkflowIdentity '${{ github.workflow_ref }}'
          cargo metadata --locked --format-version 1 | Set-Content -LiteralPath artifacts/windows/cargo-metadata.json -Encoding utf8
          pnpm list --prod --recursive --json --depth Infinity | Set-Content -LiteralPath artifacts/windows/pnpm-list.json -Encoding utf8
          node scripts/generate-windows-sbom.mjs artifacts/windows/cargo-metadata.json artifacts/windows/pnpm-list.json artifacts/windows/glitchpad-windows.cdx.json '${{ github.sha }}'

      - name: Promote truthful community evidence
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/promote-community-package.mjs --platform windows --directory artifacts/windows --source-commit '${{ github.sha }}'

      - name: Prove governed display-scale geometry
        run: node scripts/check-shell-layout.mjs --receipt artifacts/windows/shell-layout-scale-receipt.json --manifest artifacts/windows/windows-package-manifest.json --source-commit '${{ github.sha }}'

      - name: Exercise installed and portable lifecycles
        shell: pwsh
        run: |
          $fixture = 'fixtures/documents/README.md'
          [IO.File]::WriteAllText('artifacts/windows/s027-visible.txt', "S027 TXT CONTENT 7E5A`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText('artifacts/windows/s035-minimal.md', "# S035 Minimal Markdown 5E8A`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText('artifacts/windows/s038-installed-editable.md', "S038 Editable Markdown 1A2B", [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText('artifacts/windows/s038-portable-editable.md', "S038 Editable Markdown 1A2B", [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText('artifacts/windows/s038-installed-recovery.md', "# S038 Recovery Markdown 6D2E`n`n[S038_RECOVERY_RAW_SENTINEL]: https://example.invalid/recovery`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText('artifacts/windows/s038-portable-recovery.md', "# S038 Recovery Markdown 6D2E`n`n[S038_RECOVERY_RAW_SENTINEL]: https://example.invalid/recovery`n", [Text.UTF8Encoding]::new($false))
          $alpha = "# S030 Markdown Alpha 2B7C`n`n- Parent`n  - Nested child`n`n| Alpha | Beta |`n| --- | --- |`n| One | Two |`n`nFootnote[^1].`n`n[^1]: S030 Alpha Footnote 6A1E`n`n[S030_ALPHA_RAW_SENTINEL]: https://example.invalid/alpha`n"
          $beta = "# S030 Markdown Beta 9D4E`n`n> Nested quoted content`n`n``````mermaid`nflowchart TB`n  Start --> Finish`n```````n`n[S030_BETA_RAW_SENTINEL]: https://example.invalid/beta`n"
          [IO.File]::WriteAllText('artifacts/windows/s030-alpha.md', $alpha, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText('artifacts/windows/s030-beta.md', $beta, [Text.UTF8Encoding]::new($false))
          ./scripts/windows/test-installer-lifecycle.ps1 -Installer artifacts/windows/glitchpad-0.1.3-windows-x86_64-setup.exe -Fixture $fixture -TextFixture artifacts/windows/s027-visible.txt -MarkdownFixtureMinimal artifacts/windows/s035-minimal.md -MarkdownFixtureEditable artifacts/windows/s038-installed-editable.md -MarkdownFixtureRecovery artifacts/windows/s038-installed-recovery.md -MarkdownFixtureA artifacts/windows/s030-alpha.md -MarkdownFixtureB artifacts/windows/s030-beta.md -Manifest artifacts/windows/windows-package-manifest.json -ScaleMatrixReceipt artifacts/windows/shell-layout-scale-receipt.json -InstalledMarkdownReceipt artifacts/windows/installed-markdown-lifecycle-receipt.json -Receipt artifacts/windows/installer-lifecycle-receipt.json
          ./scripts/windows/test-portable-lifecycle.ps1 -PortableRoot artifacts/windows/portable -TextFixture artifacts/windows/s027-visible.txt -MarkdownFixtureMinimal artifacts/windows/s035-minimal.md -MarkdownFixtureEditable artifacts/windows/s038-portable-editable.md -MarkdownFixtureRecovery artifacts/windows/s038-portable-recovery.md -MarkdownFixtureA artifacts/windows/s030-alpha.md -MarkdownFixtureB artifacts/windows/s030-beta.md -Manifest artifacts/windows/windows-package-manifest.json -ScaleMatrixReceipt artifacts/windows/shell-layout-scale-receipt.json -Receipt artifacts/windows/portable-lifecycle-receipt.json

      - name: Validate final bytes and size policy
        run: |
          node scripts/check-windows-package.mjs --evidence artifacts/windows/windows-package-manifest.json
          node scripts/run-performance.mjs --profile desktop_reference_v1 --build-id "windows-${{ github.sha }}" --metric desktop_installer_size --artifact artifacts/windows/glitchpad-0.1.3-windows-x86_64-setup.exe --output artifacts/windows/installer-size-evidence.json
          node scripts/run-performance.mjs --profile desktop_reference_v1 --build-id "windows-${{ github.sha }}" --metric desktop_installer_size --artifact artifacts/windows/glitchpad-0.1.3-windows-x86_64.zip --output artifacts/windows/portable-size-evidence.json

      - name: Upload governed Windows package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && 'glitchpad-0.1.3-windows-x86_64-community-release' || 'glitchpad-0.1.3-windows-x86_64-unsigned-candidate' }}
          path: artifacts/windows/**
          if-no-files-found: error
          retention-days: 14
