[workspace]
members = [
    "crates/glitchpad-android-source",
    "crates/glitchpad-core",
    "crates/glitchpad-host",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
repository = "https://github.com/ShruggieTech/glitchpad"

[workspace.dependencies]
atomic-write-file = "0.3.1"
file-id = "0.2.3"
notify = "8.2.0"
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin = "2.6.3"
tauri-plugin-opener = "2.5.5"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
