[workspace]
members = [
    "crates/glitchpad-android-source",
    "crates/glitchpad-core",
    "crates/glitchpad-host",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
repository = "https://github.com/ShruggieTech/glitchpad"

[workspace.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "ico"] }
gif = { version = "=0.14.2", default-features = false, features = ["std", "raii_no_panic"] }
image-webp = { version = "=0.2.4", default-features = false }
resvg = { version = "=0.48.1", default-features = false, features = ["text"] }
roxmltree = { version = "=0.21.1", default-features = false, features = ["std"] }
kamadak-exif = "0.6.1"
quick-xml = { version = "0.42.0", default-features = false }
atomic-write-file = "0.3.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
file-id = "0.2.3"
notify = "8.2.0"
schemars = { version = "1.2.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin = "2.6.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.3"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["serde", "v4"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
