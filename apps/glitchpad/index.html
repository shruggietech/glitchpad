<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Glitchpad is a fast, cross-platform viewer and editor for local files."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Glitchpad</title>
  </head>
  <body>
    <div id="root">
      <main class="application-recovery" role="status">
        <h1>Starting Glitchpad…</h1>
        <p>
          If startup does not finish, restart Glitchpad. Previously saved
          recovery records remain available; edits since the last recovery
          snapshot may be unavailable.
        </p>
        <form><button type="submit">Restart Glitchpad</button></form>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
