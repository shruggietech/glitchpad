[package]
name = "glitchpad-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop and Android host shell for Glitchpad."
publish = false

[lib]
name = "glitchpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
glitchpad-core = { path = "../glitchpad-core", version = "=0.0.0" }
glitchpad-android-source = { path = "../glitchpad-android-source", version = "=0.0.0" }
atomic-write-file.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tauri.workspace = true
tauri-plugin-opener.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
chrono.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
file-id.workspace = true
notify.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-single-instance.workspace = true

[lints]
workspace = true
