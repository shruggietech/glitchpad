[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
atomic-write-file.workspace = true
file-id.workspace = true
notify.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
